versie: "2.0"
beschrijving: "Datatype-systeem voor JAS-begrippen (8 soorten, zie kaders.md)"

soorten:
  monetair-bedrag:
    omschrijving: "Geldbedrag in euro's"
    xsd-type: "xsd:decimal"
    eenheid: "EUR"
    voorbeelden: ["verschuldigd belastingbedrag", "termijnbedrag", "invorderingsrente"]

  percentage:
    omschrijving: "Getal uitgedrukt als rate (bijv. 4.0 voor 4%)"
    xsd-type: "xsd:decimal"
    eenheid: "procent"
    voorbeelden: ["invorderingsrentevoet", "wettelijk rentepercentage"]

  tijdsduur:
    omschrijving: "Periode uitgedrukt in weken, maanden of jaren (xsd:duration-compatibel)"
    xsd-type: "xsd:duration"
    eenheid: null
    voorbeelden: ["zes-weken", "betalingstermijn-belastingaanslag", "een-maand-na-dagtekening"]

  datum:
    omschrijving: "Kalenderdatum of tijdstip"
    xsd-type: "xsd:date"
    eenheid: null
    voorbeelden: ["dagtekening-aanslagbiljet", "vervaldag-eerste-termijn", "31-december"]

  booleaans:
    omschrijving: "Binaire waarde: ja of nee, recht bestaat of bestaat niet"
    xsd-type: "xsd:boolean"
    eenheid: null
    voorbeelden: ["invorderbaarheid", "recht-op-uitstel-van-betaling"]

  tekst:
    omschrijving: "Vrije tekstwaarde"
    xsd-type: "xsd:string"
    eenheid: null
    voorbeelden: ["naam belastingschuldige", "adres"]

  enumeratie:
    omschrijving: "Limitatieve keuze uit een vaste waardeset"
    xsd-type: "xsd:token"
    eenheid: null
    vereist-veld: "waardeset"
    voorbeelden: ["soort-belastingaanslag", "belastingschuldige"]

  entiteit:
    omschrijving: "Rechtssubject of rechtsobject als instantie (geen primitieve waarde)"
    xsd-type: null
    eenheid: null
    notitie: "Gebruik 'heeft' naar identificatiebegrip met soort-id: true"
    voorbeelden: ["belastingschuldige als persoon", "ontvanger"]
