versie: "1.0"
beschrijving: "Mapping van JAS-klassen en begrip-velden naar SKOS/RDF predicaten"

begrip-naar-skos:
  begripsnaam: "skos:prefLabel"
  aliases: "skos:altLabel"
  definitie: "skos:definition"
  begrip-id: "@id"
  geldigheid-van: "dct:valid"
  herkomst-direct: "prov:wasDerivedFrom"

relaties-naar-rdf:
  is-een: "skos:broader"
  heeft: "jas:heeft"
  leidt-tot: "jas:leidtTot"

jas-namespace: "http://regels.overheid.nl/jas/ontology#"
dct-namespace: "http://purl.org/dc/terms/"
skos-namespace: "http://www.w3.org/2004/02/skos/core#"
prov-namespace: "http://www.w3.org/ns/prov#"
