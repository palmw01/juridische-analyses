versie: "2.0"
gebaseerd-op: "JAS v1.0.10"
beschrijving: "Formele definitie van JAS-klassen, relatiematrix en conflictresolutieregels"

klassen:
  rechtssubject:
    definitie: "Drager van rechten en plichten; partij in een rechtsbetrekking"
    soort-restrictie: [entiteit, tekst]
    herkenningsvraag: "Wie heeft het recht? Wie heeft de plicht?"

  rechtsobject:
    definitie: "Voorwerp van een rechtsbetrekking of rechtsfeit"
    soort-restrictie: [enumeratie, entiteit, tekst]
    herkenningsvraag: "Wat is het voorwerp van een recht of plicht?"

  rechtsbetrekking:
    definitie: "Juridische relatie tussen twee rechtssubjecten: één rechthebbend, één plichthebbend"
    soort-restrictie: [booleaans]
    herkenningsvraag: "Hoe verhouden twee rechtssubjecten zich tot elkaar?"

  rechtsfeit:
    definitie: "Handeling, gebeurtenis of tijdsverloop waaraan rechtsgevolgen zijn verbonden"
    soort-restrictie: [datum, booleaans]
    herkenningsvraag: "Wat is de gebeurtenis die gevolgen heeft voor de rechtsbetrekking?"

  voorwaarde:
    definitie: "Conditie die beschrijft aan welke omstandigheid voldaan moet zijn voor een rechtsgevolg"
    soort-restrictie: [booleaans]
    herkenningsvraag: "Onder welke omstandigheden geldt een bepaald rechtsgevolg?"

  afleidingsregel:
    definitie: "Regel die nieuwe feiten of waarden creëert op basis van bestaande feiten of waarden"
    typen: [Beslissingsregel, Rekenregel, Beperkingsregel, Specialisatieregel]
    soort-restrictie: [booleaans, monetair-bedrag, percentage, tijdsduur, datum]
    herkenningsvraag: "Hoe wordt een variabele berekend of afgeleid?"
    vereist-regel-noot: true

  variabele:
    definitie: "Specifiek kenmerk of eigenschap van een rechtssubject, rechtsobject, rechtsbetrekking of rechtsfeit"
    soort-restrictie: [monetair-bedrag, percentage, tijdsduur, datum, tekst, enumeratie, booleaans]
    herkenningsvraag: "Wat zijn de specifieke kenmerken?"

  variabelewaarde:
    definitie: "De concrete waarde van een variabele"
    parent: variabele

  parameter:
    definitie: "Constante waarde over een bepaalde periode, gelijk voor alle instanties"
    soort-restrictie: [monetair-bedrag, percentage, tijdsduur]
    herkenningsvraag: "Is er een waarde die gedurende een periode voor iedereen gelijk is?"

  parameterwaarde:
    definitie: "De concrete waarde van een parameter"
    parent: parameter

  operator:
    definitie: "Woord of teken dat een rekenkundige bewerking, logische verbinding of vergelijking uitdrukt"
    soort-restrictie: [tekst]
    typen: [rekenkundig, vergelijking, logisch]

  tijdsaanduiding:
    definitie: "Omschrijving van een tijdstip of tijdvak"
    parent: variabele
    soort-restrictie: [datum, tijdsduur]
    prioriteit-boven: [variabele]

  plaatsaanduiding:
    definitie: "Geografische aanduiding of jurisdictie"
    parent: parameter
    soort-restrictie: [tekst, enumeratie]
    prioriteit-boven: [parameter]

  delegatiebevoegdheid:
    definitie: "De bevoegdheid om regels nader uit te werken in lagere regelgeving"
    typen: [Verplicht, Facultatief]

  delegatie-invulling:
    definitie: "De daadwerkelijke gedelegeerde regeling"
    parent: delegatiebevoegdheid

  brondefinitie:
    definitie: "Begripsomschrijving die expliciet in de wetgeving is opgenomen"
    soort-restrictie: [tekst, enumeratie]

relatiematrix:
  - van: rechtssubject
    naar: rechtsbetrekking
    predikaat: rechthebbende
    kardinaliteit: "n:m"
    mermaid-label: "rechthebbende"

  - van: rechtssubject
    naar: rechtsbetrekking
    predikaat: plichthebbende
    kardinaliteit: "n:m"
    mermaid-label: "plichthebbende"

  - van: rechtsbetrekking
    naar: rechtsobject
    predikaat: voorwerp
    kardinaliteit: "1:n"
    mermaid-label: "voorwerp"

  - van: rechtsbetrekking
    naar: voorwaarde
    predikaat: geldig-indien
    kardinaliteit: "1:n"
    mermaid-label: "geldig indien"

  - van: rechtsbetrekking
    naar: afleidingsregel
    predikaat: nader-uitgewerkt-in
    kardinaliteit: "1:n"
    mermaid-label: "nader uitgewerkt in"

  - van: rechtsfeit
    naar: rechtsbetrekking
    predikaat: triggert
    kardinaliteit: "1:n"
    mermaid-label: "triggert"

  - van: rechtsfeit
    naar: afleidingsregel
    predikaat: triggert
    kardinaliteit: "1:n"
    mermaid-label: "triggert"

  - van: afleidingsregel
    naar: variabele
    predikaat: gebruikt
    kardinaliteit: "1:n"
    mermaid-label: "gebruikt"

  - van: afleidingsregel
    naar: parameter
    predikaat: gebruikt
    kardinaliteit: "1:n"
    mermaid-label: "gebruikt"

  - van: delegatiebevoegdheid
    naar: rechtsbetrekking
    predikaat: gemandateerd-aan
    kardinaliteit: "1:1"
    mermaid-label: "gemandateerd aan"

conflictresolutie:
  - klasse-a: tijdsaanduiding
    klasse-b: variabele
    kies: tijdsaanduiding
    reden: "specificiteitsregel — tijdsaanduiding is subtype van variabele"

  - klasse-a: plaatsaanduiding
    klasse-b: parameter
    kies: plaatsaanduiding
    reden: "specificiteitsregel — plaatsaanduiding is subtype van parameter"

  - klasse-a: afleidingsregel
    klasse-b: voorwaarde
    kies: afleidingsregel
    reden: "afleidingsregel impliceert voorwaarden; kies het type dat het rechtsgevolg beschrijft"

classDef-kleuren:
  rb: "fill:#FF0000,color:#fff"
  rs: "fill:#4472C4,color:#fff"
  ro: "fill:#70AD47,color:#fff"
  rf: "fill:#FFC000"
  vw: "fill:#7030A0,color:#fff"
  ar: "fill:#00B0F0"
  va: "fill:#92D050"
  pa: "fill:#FFD966"
  ta: "fill:#F4B942"
  pl: "fill:#9DC3E6"
  db: "fill:#C9C9C9"
  bd: "fill:#D6B4C8"
  op: "fill:#808080,color:#fff"
