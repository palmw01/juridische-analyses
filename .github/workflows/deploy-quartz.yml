name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Clone Quartz
        run: git clone --depth=1 https://github.com/jackyzha0/quartz.git quartz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy vault content
        run: |
          rm -rf quartz/content
          cp -r vault quartz/content

      - name: Configureer Obsidian Graph & UI
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            // 1. Kleuren definiëren uit graph.json
            const colors = {
              'jas/rechtsbetrekking': '#FF0000',
              'jas/rechtssubject': '#447344',
              'jas/rechtsobject': '#70AC70',
              'jas/rechtsfeit': '#FFA500',
              'jas/voorwaarde': '#7030A0',
              'jas/afleidingsregel': '#00B0F0',
              'jas/variabele': '#92D050',
              'jas/parameter': '#FFD966',
              'jas/operator': '#808080',
              'jas/tijdsaanduiding': '#F4B082',
              'jas/plaatsaanduiding': '#9DC3E6',
              'jas/delegatiebevoegdheid': '#C9C9C9',
              'jas/brondefinitie': '#D6B3C8',
              'tussenresultaat': '#FF00FF'
            };

            // 2. Patch CSS
            let customCss = '\n/* Advanced Graph UI & Colors */\n';
            for (const [tag, color] of Object.entries(colors)) {
              const className = tag.replace(/\//g, '-');
              customCss += '.node.' + className + ' { fill: ' + color + ' !important; }\n';
              customCss += '.node.tag-' + className + ' { fill: ' + color + ' !important; }\n';
            }
            customCss += \`
            .graph-controls {
              position: absolute;
              top: 50px;
              right: 10px;
              background: var(--light);
              border: 1px solid var(--lightgray);
              border-radius: 8px;
              padding: 15px;
              z-index: 1000;
              font-size: 0.75rem;
              box-shadow: var(--shadow);
              width: 200px;
              backdrop-filter: blur(4px);
            }
            .graph-controls h4 { margin: 0 0 10px 0; border-bottom: 1px solid var(--lightgray); padding-bottom: 5px; }
            .graph-controls label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
            .graph-controls input[type='range'] { width: 100px; }
            .graph-settings-toggle {
              position: absolute;
              top: 10px;
              right: 10px;
              background: var(--light);
              border: 1px solid var(--lightgray);
              border-radius: 50%;
              width: 35px;
              height: 35px;
              display: flex;
              align-items: center;
              justify-content: center;
              cursor: pointer;
              z-index: 1001;
              transition: transform 0.2s ease;
            }
            .graph-settings-toggle:hover { transform: rotate(45deg); }
            \`;
            fs.appendFileSync('quartz/styles/custom.scss', customCss);

            // 3. Patch Graph.tsx voor de UI (Gebruik valide JSX)
            const graphPath = 'quartz/components/Graph.tsx';
            if (fs.existsSync(graphPath)) {
              let graphTsx = fs.readFileSync(graphPath, 'utf8');
              const uiHtml = \`
                <div className=\"graph-settings-toggle\" id=\"graph-settings-button\" aria-label=\"Instellingen\">⚙️</div>
                <div className=\"graph-controls\" id=\"graph-controls-menu\" style={{ display: \"none\" }}>
                  <h4>Analyse Filters</h4>
                  <label><input type=\"checkbox\" className=\"graph-filter\" data-folder=\"annotaties\" defaultChecked /> Annotaties</label>
                  <label><input type=\"checkbox\" className=\"graph-filter\" data-folder=\"begrippen\" defaultChecked /> Begrippen</label>
                  <label><input type=\"checkbox\" className=\"graph-filter\" data-folder=\"regels\" defaultChecked /> Regels</label>
                  
                  <h4>Krachten (Obsidian)</h4>
                  <label>Afstoting <span></span><input type=\"range\" id=\"graph-repel\" min=\"0\" max=\"200\" defaultValue=\"20\" /></label>
                  <label>Afstand <span></span><input type=\"range\" id=\"graph-distance\" min=\"50\" max=\"600\" defaultValue=\"450\" /></label>
                  <label>Pijlen <input type=\"checkbox\" id=\"graph-arrows\" /></label>
                </div>
              \`;
              // We injecteren het binnen de bestaande div.
              // Quartz v4 gebruikt Preact, dus 'class' werkt vaak ook, maar 'className' is veiliger in TSX.
              graphTsx = graphTsx.replace('<div class={classNames(displayClass, \"graph\")}>', '<div class={classNames(displayClass, \"graph\")}>' + uiHtml);
              fs.writeFileSync(graphPath, graphTsx);
            }

            // 4. Patch de client-side JS (graph.inline.ts)
            const scriptPath = 'quartz/components/scripts/graph.inline.ts';
            if (fs.existsSync(scriptPath)) {
              let scriptJs = fs.readFileSync(scriptPath, 'utf8');
              const injection = \`
                // Custom Obsidian-like controls injection
                document.addEventListener('DOMContentLoaded', () => {
                  const settingsBtn = document.getElementById('graph-settings-button');
                  const menu = document.getElementById('graph-controls-menu');
                  if (settingsBtn && menu) {
                    settingsBtn.onclick = () => menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
                  }
                });
              \`;
              fs.appendFileSync(scriptPath, injection);
            }

            // 5. Update layout
            let l = fs.readFileSync('./quartz.layout.ts', 'utf8');
            if (!l.includes('Component.Graph()')) {
               l = l.replace('right: [', 'right: [Component.Graph(), ');
            }
            fs.writeFileSync('./quartz.layout.ts', l);

            console.log('Obsidian Advanced Graph v2.1 (gefixte JSX) geïnjecteerd.');
          "

      - name: Injecteer frontmatter-links in body
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const START = '<!-- fm-links-start -->';
            const END   = '<!-- fm-links-end -->';
            const SKIP  = new Set(['index.md', 'template.md']);
            const RE_WIKILINK = /\[\[[^\]]+\]\]/g;
            const RE_BLOCK    = new RegExp(START + '[\\\\s\\\\S]*?' + END);

            function allLinks(text) {
              return new Set(text.match(RE_WIKILINK) || []);
            }

            function processFile(filePath) {
              let src = fs.readFileSync(filePath, 'utf8');
              if (!src.startsWith('---')) return;

              // Splits frontmatter en body
              const fmEnd = src.indexOf('\\n---', 3);
              if (fmEnd === -1) return;
              const fm   = src.slice(0, fmEnd + 4);
              const body = src.slice(fmEnd + 4);

              // Wiki-links in frontmatter
              const fmLinks = allLinks(fm);
              if (fmLinks.size === 0) return;

              // Verwijder eventueel oud blok om dubbeltelling te voorkomen
              const bodyClean = body.replace(RE_BLOCK, '');

              // Alleen links die nog niet in de body staan
              const bodyLinks = allLinks(bodyClean);
              const extra = [...fmLinks].filter(l => !bodyLinks.has(l));
              if (extra.length === 0) return;

              const block = START + '\\n' + extra.join('\\n') + '\\n' + END;
              fs.writeFileSync(filePath, fm + bodyClean.trimEnd() + '\\n\\n' + block + '\\n');
            }

            let n = 0;
            for (const folder of ['annotaties', 'begrippen', 'regels']) {
              const dir = path.join('content', folder);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir)) {
                if (!f.endsWith('.md') || SKIP.has(f)) continue;
                processFile(path.join(dir, f));
                n++;
              }
            }
            console.log('Frontmatter-links geinjekteerd: ' + n + ' bestanden');
          "

      - name: Genereer mapindex-links
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const MARKER = '<!-- auto-index -->';
            const MARKER_END = '<!-- /auto-index -->';
            const SKIP = new Set(['index.md', 'template.md']);

            for (const folder of ['annotaties', 'begrippen', 'regels']) {
              const dir = path.join('content', folder);
              const indexPath = path.join(dir, 'index.md');
              if (!fs.existsSync(indexPath) || !fs.existsSync(dir)) continue;

              const files = fs.readdirSync(dir)
                .filter(f => f.endsWith('.md') && !SKIP.has(f))
                .sort();
              if (files.length === 0) continue;

              const links = files
                .map(f => '- [[' + folder + '/' + f.replace('.md', '') + ']]')
                .join('\n');
              const block = MARKER + '\n' + links + '\n' + MARKER_END;

              let content = fs.readFileSync(indexPath, 'utf8');
              const re = new RegExp(MARKER + '[\\s\\S]*?' + MARKER_END);
              content = re.test(content)
                ? content.replace(re, block)
                : content + '\n\n' + block + '\n';
              fs.writeFileSync(indexPath, content);
              console.log(folder + ': ' + files.length + ' noten geindexeerd');
            }
          "

      - name: Patch PageTitle voor mobiele afkorting
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const f = 'quartz/components/PageTitle.tsx';
            let c = fs.readFileSync(f, 'utf8');
            c = c.replace(
              '<a href={baseDir}>{title}</a>',
              '<a href={baseDir}><span class=\"title-full\">{title}</span><span class=\"title-short\">Wetsanalyse</span></a>'
            );
            fs.writeFileSync(f, c);
          "

      - name: Kopieer custom styles
        run: cat vault/.github/quartz-custom.scss >> quartz/quartz/styles/custom.scss

      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build 2>&1
          test "$(ls -A public 2>/dev/null)" || (echo "FOUT: geen output in public/" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
