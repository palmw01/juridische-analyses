name: Trigger Quartz rebuild

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wetten-overheid-tools quartz build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.QUARTZ_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/palmw01/wetten-overheid-tools/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
