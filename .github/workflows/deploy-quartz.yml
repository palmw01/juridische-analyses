name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Clone Quartz
        run: git clone --depth=1 https://github.com/jackyzha0/quartz.git quartz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy vault content
        run: |
          rm -rf quartz/content
          cp -r vault quartz/content

      - name: Patch quartz.config.ts
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('./quartz.config.ts', 'utf8');
            c = c.replace(/pageTitle: \x22[^\x22]*\x22/, 'pageTitle: \x22Juridische wetsanalyse - Inning\x22');
            c = c.replace(/baseUrl: \x22[^\x22]*\x22/, 'baseUrl: \x22palmw01.github.io/juridische-analyses\x22');
            c = c.replace(/locale: \x22[^\x22]*\x22/, 'locale: \x22nl-NL\x22');
            c = c.replace(/ignorePatterns: \[[\s\S]*?\]/,
              'ignorePatterns: [\x22.obsidian\x22,\x22.claude\x22,\x22.git\x22,\x22.trash\x22,\x22README.md\x22,\x22CLAUDE.md\x22,\x22settings.json\x22,\x22**/template.md\x22]');
            fs.writeFileSync('./quartz.config.ts', c);
          "

      - name: Injecteer frontmatter-links in body
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const START = '<!-- fm-links-start -->';
            const END   = '<!-- fm-links-end -->';
            const SKIP  = new Set(['index.md', 'template.md']);
            const RE_WIKILINK = /\[\[[^\]]+\]\]/g;
            const RE_BLOCK    = new RegExp(START + '[\\\\s\\\\S]*?' + END);

            function allLinks(text) {
              return new Set(text.match(RE_WIKILINK) || []);
            }

            function processFile(filePath) {
              let src = fs.readFileSync(filePath, 'utf8');
              if (!src.startsWith('---')) return;

              // Splits frontmatter en body
              const fmEnd = src.indexOf('\\n---', 3);
              if (fmEnd === -1) return;
              const fm   = src.slice(0, fmEnd + 4);
              const body = src.slice(fmEnd + 4);

              // Wiki-links in frontmatter
              const fmLinks = allLinks(fm);
              if (fmLinks.size === 0) return;

              // Verwijder eventueel oud blok om dubbeltelling te voorkomen
              const bodyClean = body.replace(RE_BLOCK, '');

              // Alleen links die nog niet in de body staan
              const bodyLinks = allLinks(bodyClean);
              const extra = [...fmLinks].filter(l => !bodyLinks.has(l));
              if (extra.length === 0) return;

              const block = START + '\\n' + extra.join('\\n') + '\\n' + END;
              fs.writeFileSync(filePath, fm + bodyClean.trimEnd() + '\\n\\n' + block + '\\n');
            }

            let n = 0;
            for (const folder of ['annotaties', 'begrippen', 'regels']) {
              const dir = path.join('content', folder);
              if (!fs.existsSync(dir)) continue;
              for (const f of fs.readdirSync(dir)) {
                if (!f.endsWith('.md') || SKIP.has(f)) continue;
                processFile(path.join(dir, f));
                n++;
              }
            }
            console.log('Frontmatter-links geinjekteerd: ' + n + ' bestanden');
          "

      - name: Genereer mapindex-links
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const MARKER = '<!-- auto-index -->';
            const MARKER_END = '<!-- /auto-index -->';
            const SKIP = new Set(['index.md', 'template.md']);

            for (const folder of ['annotaties', 'begrippen', 'regels']) {
              const dir = path.join('content', folder);
              const indexPath = path.join(dir, 'index.md');
              if (!fs.existsSync(indexPath) || !fs.existsSync(dir)) continue;

              const files = fs.readdirSync(dir)
                .filter(f => f.endsWith('.md') && !SKIP.has(f))
                .sort();
              if (files.length === 0) continue;

              const links = files
                .map(f => '- [[' + folder + '/' + f.replace('.md', '') + ']]')
                .join('\n');
              const block = MARKER + '\n' + links + '\n' + MARKER_END;

              let content = fs.readFileSync(indexPath, 'utf8');
              const re = new RegExp(MARKER + '[\\s\\S]*?' + MARKER_END);
              content = re.test(content)
                ? content.replace(re, block)
                : content + '\n\n' + block + '\n';
              fs.writeFileSync(indexPath, content);
              console.log(folder + ': ' + files.length + ' noten geindexeerd');
            }
          "

      - name: Patch PageTitle voor mobiele afkorting
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            const f = 'quartz/components/PageTitle.tsx';
            let c = fs.readFileSync(f, 'utf8');
            c = c.replace(
              '<a href={baseDir}>{title}</a>',
              '<a href={baseDir}><span class=\"title-full\">{title}</span><span class=\"title-short\">Juridische wetsanalyse</span></a>'
            );
            fs.writeFileSync(f, c);
          "

      - name: Kopieer custom styles
        run: cat vault/.github/quartz-custom.scss >> quartz/quartz/styles/custom.scss

      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build 2>&1
          test "$(ls -A public 2>/dev/null)" || (echo "FOUT: geen output in public/" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
