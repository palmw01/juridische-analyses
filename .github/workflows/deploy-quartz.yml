name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Clone Quartz
        run: git clone --depth=1 https://github.com/jackyzha0/quartz.git quartz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install Quartz dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy vault content
        run: |
          rm -rf quartz/content
          cp -r vault quartz/content

      - name: Patch quartz.config.ts
        working-directory: quartz
        run: |
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('./quartz.config.ts', 'utf8');
            c = c.replace(/pageTitle: \x22[^\x22]*\x22/, 'pageTitle: \x22Juridische wetsanalyse — Inning\x22');
            c = c.replace(/baseUrl: \x22[^\x22]*\x22/, 'baseUrl: \x22palmw01.github.io/juridische-analyses\x22');
            c = c.replace(/locale: \x22[^\x22]*\x22/, 'locale: \x22nl-NL\x22');
            c = c.replace(/ignorePatterns: \[[\s\S]*?\]/,
              'ignorePatterns: [\x22.obsidian\x22,\x22.claude\x22,\x22.git\x22,\x22.trash\x22,\x22README.md\x22,\x22CLAUDE.md\x22,\x22settings.json\x22,\x22**/template.md\x22]');
            fs.writeFileSync('./quartz.config.ts', c);
          "

      - name: Patch quartz.layout.ts
        working-directory: quartz
        run: |
          python3 << 'PYEOF'
          import re

          with open('./quartz.layout.ts', 'r') as f:
              c = f.read()

          # Configureer Graph-component met JAS-optimale instellingen
          c = re.sub(
              r'Component\.Graph\(\)',
              '''Component.Graph({
            localGraph: {
              showTags: false,
              depth: 2,
              scale: 1.1,
              repelForce: 5,
            },
            globalGraph: {
              showTags: false,
              depth: -1,
              scale: 0.9,
              repelForce: 2,
            },
          })''',
              c
          )

          # Voeg RecentNotes toe na Backlinks in defaultContentPageLayout
          c = c.replace(
              'Component.Backlinks(),',
              'Component.Backlinks(),\n    Component.RecentNotes({ title: "Recent toegevoegd", limit: 5 }),',
              1
          )

          with open('./quartz.layout.ts', 'w') as f:
              f.write(c)

          print("quartz.layout.ts gepatcht")
          PYEOF

      - name: Inject aangepaste CSS
        working-directory: quartz
        run: |
          python3 << 'PYEOF'
          css = """
          /* Juridische wetsanalyse — aangepaste stijlen */

          /* Wetstekst blockquotes: herkenbare juridische opmaak */
          blockquote {
            border-left: 3px solid var(--secondary) !important;
            background: var(--highlight);
            padding: 0.5em 1em;
            border-radius: 0 4px 4px 0;
            font-style: normal !important;
          }

          /* Annotatietabellen: compacter en leesbaarder */
          table {
            font-size: 0.88em;
          }

          /* Graaf-container: subtiele afronding */
          #graph-container {
            border-radius: 6px;
            overflow: hidden;
          }

          /* Inhoudsopgave: iets kleiner lettertype */
          .toc ul {
            font-size: 0.85em;
          }
          """

          with open('./quartz/styles/custom.scss', 'w') as f:
              f.write(css)

          print("custom.scss geschreven")
          PYEOF

      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build 2>&1
          test "$(ls -A public 2>/dev/null)" || (echo "FOUT: geen output in public/" && exit 1)

      - name: Inject JAS-graaf-script
        working-directory: quartz
        run: |
          python3 << 'PYEOF'
          import os

          js = r"""(function () {
            'use strict';

            var JAS_KLEUREN = {
              'jas/rechtsbetrekking': '#FF0000',
              'jas/rechtssubject': '#4472C4',
              'jas/rechtsobject': '#70AD47',
              'jas/rechtsfeit': '#FFC000',
              'jas/voorwaarde': '#7030A0',
              'jas/afleidingsregel': '#00B0F0',
              'jas/variabele': '#92D050',
              'jas/parameter': '#FFD966',
              'jas/tijdsaanduiding': '#F4B942',
              'jas/plaatsaanduiding': '#9DC3E6',
              'jas/delegatiebevoegdheid': '#C9C9C9',
              'jas/brondefinitie': '#D6B4C8',
              'jas/operator': '#808080'
            };

            var TYPE_KLEUREN = {
              'annotatie': '#E8EAF6',
              'begrip':    '#F0F4FF',
              'afleidingsregel': '#E0F7FA'
            };

            var kleurMap   = {};
            var dataGeladen = false;

            async function laadData() {
              try {
                var base = document.querySelector('base');
                var baseHref = base ? base.getAttribute('href') : '/';
                var resp = await fetch(baseHref + 'static/contentIndex.json');
                if (!resp.ok) return;
                var data = await resp.json();

                for (var slug in data) {
                  var pagina = data[slug];
                  var tags = (pagina.tags || []).map(function (t) {
                    return t.toLowerCase();
                  });
                  var kleur = null;

                  for (var i = 0; i < tags.length; i++) {
                    if (JAS_KLEUREN[tags[i]]) { kleur = JAS_KLEUREN[tags[i]]; break; }
                  }
                  if (!kleur) {
                    for (var i = 0; i < tags.length; i++) {
                      if (TYPE_KLEUREN[tags[i]]) { kleur = TYPE_KLEUREN[tags[i]]; break; }
                    }
                  }

                  if (kleur) kleurMap[slug] = kleur;
                }

                dataGeladen = true;
                kleurKnooppunten();
              } catch (e) { /* stil mislukken */ }
            }

            function kleurKnooppunten() {
              if (!dataGeladen) return;
              document.querySelectorAll('svg .node').forEach(function (g) {
                var d = g.__data__;
                if (!d || !d.id) return;
                var kleur = kleurMap[d.id];
                if (!kleur) return;
                var cirkel = g.querySelector('circle');
                if (cirkel) cirkel.style.setProperty('fill', kleur, 'important');
              });
            }

            laadData();

            document.addEventListener('nav', function () {
              setTimeout(kleurKnooppunten, 400);
              setTimeout(kleurKnooppunten, 1200);
            });

            var obs = new MutationObserver(function () {
              if (dataGeladen) kleurKnooppunten();
            });
            obs.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: false
            });
          })();
          """

          # Schrijf script naar public/
          with open('./public/jas-graph.js', 'w', encoding='utf-8') as f:
              f.write(js)

          # Injecteer <script>-tag in alle HTML-bestanden
          script_tag = '<script src="/juridische-analyses/jas-graph.js" defer></script>'
          count = 0
          for root, dirs, files in os.walk('./public'):
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8', errors='replace') as f:
                      c = f.read()
                  if 'jas-graph.js' not in c:
                      c = c.replace('</head>', script_tag + '</head>', 1)
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(c)
                      count += 1

          print(f'JAS-graaf-script geïnjecteerd in {count} HTML-bestanden')
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
