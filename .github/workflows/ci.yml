name: CI — vault-validatie

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installeer dependencies + graphviz
        run: |
          pip install -r requirements.lock
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Full CI (validate + views + export-rdf + export-graph + check-enrichment)
        run: make ci

      - name: Genereer PDF-kennisgraaf
        run: python tools/generate_pdf_graph.py
