name: CI — vault-validatie

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installeer dependencies
        run: pip install -r requirements.lock

      - name: Validatie (L1 + L2 + L3)
        run: python tools/validate_note.py --full

      - name: Genereer views
        run: python tools/generate_views.py
