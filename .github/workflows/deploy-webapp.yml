name: Deploy webapp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Installeer Python dependencies
        run: pip install -r requirements.lock

      - name: Installeer Node.js dependencies
        run: cd sitegen/scripts && npm install --silent

      - name: Exporteer RDF + Genereer webapp
        run: make webapp OUT=webapp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
