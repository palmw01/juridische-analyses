kolommen:
- label: Standaard positief — dagtekening in april (midden van het jaar)
  invoer:
    BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet: '4'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/resterende-maanden-jaar: '8'
  is-voorspelling-juist: ja
  toelichting: 'Aanslagbiljet gedagtekend in april (maand 4). Formule: 12 − 4 = 8.
    Na de dagtekeningmaand april resteren in het jaar 8 kalendermaanden (mei t/m december).
    Algoritmisch bepaalbaar via directe aftrekking.'
- label: Nul-geval — dagtekening in december, geen resterende maanden
  invoer:
    BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet: '12'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/resterende-maanden-jaar: '0'
  is-voorspelling-juist: ja
  toelichting: 'Aanslagbiljet gedagtekend in december (maand 12). Formule: 12 − 12
    = 0. Na de dagtekeningmaand december resteren 0 maanden in het jaar. Dit is het
    nul-geval: de terugvalregel van art. 9 lid 5 derde volzin IW 1990 is van toepassing;
    de specialisatieregel herneemt niet.'
- label: Grenswaarde — maximale resterende maanden (dagtekening in januari)
  invoer:
    BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet: '1'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/resterende-maanden-jaar: '11'
  is-voorspelling-juist: ja
  toelichting: 'Aanslagbiljet gedagtekend in januari (maand 1). Formule: 12 − 1 =
    11. Na de dagtekeningmaand januari resteren 11 kalendermaanden (februari t/m december).
    Dit is de maximale uitkomst van de rekenregel. Noot: een "negatief geval" (geen
    resterende maanden als gevolg van het invoerbereik) bestaat niet voor deze formule
    — elke geldige maandinvoer (1–12) levert een uitkomst op tussen 0 en 11. Het
    nul-geval (december) is opgenomen als kolom 2.'
- label: Grensgeval — dagtekening in november, één resterende maand
  invoer:
    BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet: '11'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/resterende-maanden-jaar: '1'
  is-voorspelling-juist: ja
  toelichting: 'Aanslagbiljet gedagtekend in november (maand 11). Formule: 12 − 11
    = 1. Na november resteert precies 1 kalendermaand (december). Dit is een grensgeval:
    met precies 1 resterende maand is de termijnenberekening ≤ 1 en herneemt art.
    9 lid 1 IW 1990 via de terugvalregel (derde volzin lid 5). Let op: de dagtekeningmaand
    telt zelf niet mee — een gangbare misvatting die bij november tot een fout resultaat
    van 2 zou leiden.'
- label: Ongeldige invoer — maandgetal buiten bereik (13)
  invoer:
    BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet: '13'
  is-invoer-juist: nee
  verwachte-uitvoer: {}
  is-voorspelling-juist: nvt
  toelichting: Een maandgetal van 13 bestaat niet in de gregoriaanse kalender; het
