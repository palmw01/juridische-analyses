  verwachte-uitvoer:
    BWBR0024096/par9-5/vervaldag-normaal-jaar-28-februari: nvt
  is-voorspelling-juist: ja
  toelichting: 'Dagtekening 28 februari 2025 (geen schrikkeljaar); betalingstermijn
    één maand. AR-BWBR0024096-par9-5-f is uitsluitend actief voor de zes-weken-tak;
    de één-maandvariant valt onder AR-BWBR0024096-par9-5-e (beperkingsregel 31 maart).
    Dit grensgeval illustreert de grens van het toepassingsbereik: de dagtekening-voorwaarde
    is vervuld maar de termijn-voorwaarde is niet de zes-wekentak. Uitvoer van déze
    regel is niet van toepassing; de uitkomst 31 maart behoort toe aan AR-5e.'
- label: Negatief — dagtekening niet 28 februari (voorwaarde niet vervuld)
  invoer:
    BWBR0024096/par9-5/dagtekening-28-februari: nee
    BWBR0024096/par9-5/betalingstermijn-een-maand-of-zes-weken: zes weken
  is-invoer-juist: ja
  verwachte-uitvoer:
