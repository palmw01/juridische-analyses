  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/vervaldag-volgende-termijnen: 2026-11-30, 2026-12-31
  is-voorspelling-juist: ja
  toelichting: 'Eerste termijn vervalt op 31 oktober 2026. De ankerdagnummermethode
    is van toepassing: het originele dagnummer (31) geldt als anker voor de gehele
    reeks; per maand wordt afzonderlijk gecorrigeerd als die dag niet bestaat. Dit
    voorkomt dat een kortemaand-correctie structureel doorwerkt in alle volgende termijnen.
    Iteratie: 31 oktober + 1 maand → dag 31 in november bestaat niet → 30 november;
    dag 31 in december bestaat wél → 31 december. Uitkomst: 30 november en 31 december
    2026. De ankermethode is de juridisch aanvaarde uitleg van "telkens een maand later"
    (art. 9 lid 5 IW 1990) bij kortemaand-grensgevallen.'
