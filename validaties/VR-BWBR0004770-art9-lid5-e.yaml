  toelichting: 'Voorlopige aanslag IB 2026, dagtekening december 2026. Na december
    resteren 0 kalendermaanden in het belastingjaar; resterende-maanden-jaar = 0,
    dus ≤ 1. De termijnenberekening levert 0 termijnen op: strikt minder dan meer
    dan één termijn. De derde volzin van art. 9 lid 5 IW 1990 activeert de terugvalregel
    (terugvalregel-lid-1 = ja). De invorderbaarheid via AR-1-a is de uitvoer van een
    aparte regel; deze VR toetst uitsluitend het activatie-signaal van AR-5e.'
- label: Grensgeval — november (1 resterende maand), terugvalregel actief op de drempel
  invoer:
    BWBR0004770/art9/lid5/resterende-maanden-jaar: '1'
    BWBR0004770/art9/lid5/termijnenberekening-resterende-maanden: '1'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/terugvalregel-lid-1: ja
  is-voorspelling-juist: ja
  toelichting: 'Voorlopige aanslag IB 2026, dagtekening november 2026. Na november
    resteert precies 1 kalendermaand (december); resterende-maanden-jaar = 1. De eerste
    volzin van art. 9 lid 5 zou leiden tot 1 termijn (≤ 1). De conditie "niet leidt
    tot meer dan één termijn" is vervuld: ook 1 termijn valt eronder. Grensgeval:
    de terugvalregel is actief (ja) en lid 1 herneemt. Dit vereist juridische bevestiging
    omdat "niet meer dan één" zowel 0 als 1 omvat.'
- label: Negatief — oktober (2 resterende maanden), terugvalregel niet actief
  invoer:
