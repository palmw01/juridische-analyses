    BWBR0004770/art9/lid5/termijnenberekening-resterende-maanden: '2'
  is-invoer-juist: ja
  verwachte-uitvoer:
    BWBR0004770/art9/lid5/terugvalregel-lid-1: nee
  is-voorspelling-juist: ja
  toelichting: 'Voorlopige aanslag IB 2026, dagtekening oktober 2026. Na oktober resteren
    2 kalendermaanden (november en december); resterende-maanden-jaar = 2, dus > 1.
    De eerste volzin van art. 9 lid 5 leidt tot 2 termijnen: meer dan één. De terugvalregel
    is niet actief (nee); lid 5 eerste volzin blijft gelden. AR-1-a is niet getriggerd
    via deze regel.'
- label: Ongeldige invoer — resterende-maanden-jaar ontbreekt (null)
