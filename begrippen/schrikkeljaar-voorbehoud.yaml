begrip-id: BWBR0024096/par9-5/schrikkeljaar-voorbehoud
begripsnaam: schrikkeljaar-voorbehoud
aliases: []
soort: booleaans
soort-id: false
jas-klasse: voorwaarde
toelichting-klasse: >-
  'Tenzij' introduceert een uitzondering op de standaardregel voor het 28-februari-scenario. Het
  schrikkeljaarvoorbehoud is een negatieve voorwaarde (NIET-operator) die de standaardregel doorbreekt:
  in een schrikkeljaar is 28 februari niet de laatste dag van de maand.
herkomst: direct
status: concept
definitie:
  kern: >-
    De uitzondering die is vervuld wanneer het jaar van de dagtekening een schrikkeljaar is, waardoor
    in het 28-februari-scenario de standaardregel (beperkingsregel: vervaldatum op 31 maart resp.
    11 april) wordt terzijde gesteld en de 'dan wel'-regel (28 maart resp. 10 april) van toepassing is
  contexten: []
definitie-versie: 1
definitie-gebaseerd-op:
- m-001
markeringen:
- markering-id: m-001
  bron-annotatie-id: BWBR0024096/par9-5
  tekst: "tenzij het jaartal aangeeft dat het een schrikkeljaar is"
  interpretatiemethode: grammaticaal
  bijdrage: primair
  bevestigd: true
  bevestigd-op: '2026-05-15'
geldigheid-van: "2026-01-01"
geldigheid-tot: null
vervangen-door: null
relaties:
  is-een: []
  heeft: []
