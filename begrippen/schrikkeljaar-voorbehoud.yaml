    relatie-soort: causaal
voorbeelden:
- stelling: "Schrikkeljaar-voorbehoud: aanslagbiljet gedagtekend op 28 februari 2024 — is het schrikkeljaar-voorbehoud van toepassing?"
  waar: true
  toelichting: "2024 is een schrikkeljaar; 28 februari is niet de laatste dag van de maand; de standaardregel wordt terzijde gesteld en de schrikkeljaarregel (28 maart resp. 10 april) geldt."
- stelling: "Schrikkeljaar-voorbehoud: aanslagbiljet gedagtekend op 28 februari 2025 — is het schrikkeljaar-voorbehoud van toepassing?"
  waar: false
  toelichting: "Grensgeval: 2025 is geen schrikkeljaar; 28 februari is de laatste dag van de maand; de standaardregel is van toepassing en de 'dan wel'-regel is niet van toepassing."
kenmerken:
- "Negatieve conditie (tenzij): de uitzondering is actief als het schrikkeljaar-criterium waar is"
- "Uitsluitend relevant bij dagtekening 28 februari"
- "Schrikkeljaar: jaar deelbaar door 4, met correctie voor eeuwjaren (deelbaar door 400)"
- "Effect: bij schrikkeljaar valt 28 februari niet op de laatste dag van de maand, zodat de één-maand-termijn op 28 maart vervalt"
