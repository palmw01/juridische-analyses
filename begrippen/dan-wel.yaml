voorbeelden:
- stelling: "Dan-wel: schrikkeljaar, dagtekening 28 februari, betalingstermijn één maand — vervaldatum is 28 maart dan wel 10 april?"
  waar: true
  toelichting: "De 'dan wel'-operator onderscheidt: bij één maand is het 28 maart; bij zes weken is het 10 april. In dit geval geldt 28 maart."
- stelling: "Dan-wel: niet-schrikkeljaar, dagtekening 28 februari — 'dan wel' is van toepassing?"
  waar: false
  toelichting: "Grensgeval: bij een niet-schrikkeljaar is 28 februari de laatste dag van februari, zodat de standaardregel (31 maart resp. 11 april) geldt — de 'dan wel'-constructie is uitsluitend van toepassing in het schrikkeljaarscenario."
kenmerken:
- "Disjunctie van twee uitsluitende keuzes, bepaald door de reeds bekende termijnlengte"
- "Functioneert als OF-operator maar benadrukt de alternativiteit van uitkomsten"
- "Onderscheidt 'één maand later' (28 maart) van 'zes weken later' (10 april) in schrikkeljaarscenario"
