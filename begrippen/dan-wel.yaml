begrip-id: BWBR0024096/par9-5/dan-wel
begripsnaam: dan-wel
aliases: []
soort: tekst
soort-id: false
jas-klasse: operator
toelichting-klasse: >-
  Disjunctieve operator (OF-equivalent) die de twee vervaldatums in het schrikkeljaarscenario onderscheidt
  naar termijnlengte: 28 maart (één maand) dan wel 10 april (zes weken).
herkomst: direct
status: concept
definitie:
  kern: >-
    Disjunctieve operator die twee uitsluitende alternatieven onderscheidt waarbij de keuze bepaald
    wordt door een reeds vaststaande conditie; in sectie 9.5 LI 2008 onderscheidt 'dan wel' de
    vervaldatum bij een één-maandtermijn (28 maart) van de vervaldatum bij een zes-wekentermijn
    (10 april) in het schrikkeljaarscenario
  contexten: []
