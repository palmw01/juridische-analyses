begrip-id: BWBR0024096/par9-1/vervaldag-31-december
begripsnaam: vervaldag-31-december
aliases: []
soort: datum
soort-id: false
jas-klasse: afleidingsregel
toelichting-klasse: >-
  Stelt een nieuwe waarde vast voor de vervaldag op grond van LI 2008 §9.1, eerste volzin.
  De leidt-tot-relatie naar invorderbaarheid (BWBR0004770/art9/lid1) is een bewuste cross-law
  verwijzing: de Leidraad (uitvoeringsbeleid) specificeert wanneer de wettelijke invorderbaarheid
  per IW 1990 art. 9 lid 1 in werking treedt. De Leidraad is subordinaat aan de wet maar vult
  de open norm van de betalingstermijn in.
herkomst: afgeleid
