- stelling: "Vervaldag-kortemaand-een-maand: dagtekening 31 oktober, betalingstermijn één maand — vervaldag is 30 november?"
  waar: true
  toelichting: "31 november bestaat niet; de beperkingsregel stelt de vervaldag op de laatste dag van de volgmaand: 30 november."
- stelling: "Vervaldag-kortemaand-een-maand: dagtekening 15 oktober, betalingstermijn één maand — vervaldag is 30 november?"
