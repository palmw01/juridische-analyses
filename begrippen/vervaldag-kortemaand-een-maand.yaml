begrip-id: BWBR0024096/par9-5/vervaldag-kortemaand-een-maand
begripsnaam: vervaldag-kortemaand-een-maand
aliases: []
soort: datum
soort-id: false
jas-klasse: afleidingsregel
toelichting-klasse: >-
  Rekenregel die de vervaldag bepaalt bij dagtekening 31 oktober en termijn van één maand: de dag die
  hetzelfde nummer heeft als de dagtekening bestaat niet in november (31 november bestaat niet), zodat
  de laatste dag van november (30 november) de vervaldag is. Dit impliceert de beperkingsregel voor
  maanden met minder dan 31 dagen.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De berekende vervaldag bij een betalingstermijn van één maand en dagtekening op de laatste dag van
    een maand met 31 dagen, vastgesteld op de laatste dag van de volgmaand omdat de volgmaand minder
    dagen telt dan de dagtekeningmaand; geïllustreerd aan dagtekening 31 oktober — vervaldag 30 november
  contexten: []
