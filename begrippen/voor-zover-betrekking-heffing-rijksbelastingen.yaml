voorbeelden:
- stelling: "Een bepaling uit de Algemene douanewet die de berekening van invoerrechten regelt, voldoet aan de voorwaarde 'betrekking hebben op de heffing van rijksbelastingen'?"
  waar: true
  toelichting: "Invoerrechten zijn rijksbelastingen; een berekeningsbepaling heeft direct betrekking op de heffing ervan en voldoet daarmee aan de 'voor zover'-voorwaarde."
- stelling: "Een bepaling over de douaneaangifte-procedure (zonder heffingsaspect) voldoet aan de voorwaarde?"
  waar: false
  toelichting: "Grensgeval: de aangifte-procedure zelf heeft geen directe betrekking op de heffing maar op de procedurele verplichtingen; de 'voor zover'-voorwaarde is niet vervuld en de bepaling valt buiten de reikwijdte van art. 2 lid 2 sub b IW 1990."
kenmerken:
- "Beperkende 'voor zover'-constructie — beperkt tot een deelverzameling"
- "Test: heeft de bepaling direct betrekking op de heffing? Zo nee → buiten scope"
- "Filtert douanerechtelijke bepalingen naar hun relatie tot heffing"
