begrip-id: BWBR0004770/art2/lid2/voor-zover-betrekking-heffing-rijksbelastingen
begripsnaam: voor zover betrekking heffing rijksbelastingen
aliases: []
soort: booleaans
soort-id: false
jas-klasse: voorwaarde
toelichting-klasse: >-
  De zinsnede 'voor zover' introduceert een beperkende voorwaarde bij de definitie van 'wettelijke
  regeling betreffende de heffing van rijksbelastingen'. Alleen die bepalingen van de Algemene
  douanewet vallen eronder die betrekking hebben op heffing — niet op andere douanerechtelijke
  onderwerpen. Grammaticaal herkenbaar aan het voegwoord 'voor zover'.
herkomst: direct
status: concept
definitie:
  kern: >-
    De beperkende voorwaarde dat uitsluitend die wettelijke bepalingen van de Algemene douanewet
    in aanmerking komen die betrekking hebben op de heffing van rijksbelastingen — bepalingen
    die geen betrekking hebben op heffing zijn uitgesloten
  contexten: []
