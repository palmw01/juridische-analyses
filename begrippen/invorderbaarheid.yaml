begrip-id: BWBR0004770/art9/lid1/invorderbaarheid
begripsnaam: invorderbaarheid
aliases:
- invorderbaar
soort: booleaans
soort-id: false
jas-klasse: rechtsbetrekking
toelichting-klasse: >-
  Het werkwoord 'is invorderbaar' drukt de juridische toestand uit die de rechtsbetrekking tussen ontvanger
  (rechthebbende) en belastingschuldige (plichthebbende) activeert. Rechtssubjecten worden in lid 1 niet
  expliciet benoemd; zij vloeien voort uit art. 2 en 3 IW 1990. Invorderbaarheid is de drempelvoorwaarde
  voor het inzetten van invorderingsmaatregelen.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De juridische toestand waarin een belastingaanslag verkeert zodra de wettelijke betalingstermijn is
    verstreken, op grond waarvan de ontvanger bevoegd is invorderingsmaatregelen te treffen jegens de
    belastingschuldige
  contexten:
  - markering-id: m-002
    bijdrage: verfijning
    tekst: >-
      In de context van art. 9 lid 5 IW 1990 treedt invorderbaarheid niet eenmalig in, maar telkens
      opnieuw per betalingstermijn — op de achtereenvolgende data waarop elke termijn verschuldigd
      wordt; de bevoegdheid tot invorderingsmaatregelen herleeft daarmee N maal
    toelichting: >-
      Lid 5 is een lex-specialis van lid 1; de kern (bevoegdheid zodra betalingstermijn verstreken)
      blijft intact, maar de iteratieve werking onderscheidt de lid-5-context fundamenteel van het
      eenmalige omslagmoment in lid 1
definitie-versie: 2
definitie-gebaseerd-op:
- m-001
