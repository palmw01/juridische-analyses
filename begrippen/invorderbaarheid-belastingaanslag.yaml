voorbeelden:
- stelling: "Belastingaanslag IB, dagtekening 1 januari 2026, beoordelingstijdstip 12 februari 2026 (42 dagen later) — is de aanslag invorderbaar?"
  waar: true
  toelichting: "Zes weken (42 kalenderdagen) zijn verstreken; de beslissingsregel levert 'invorderbaar: ja' op."
- stelling: "Belastingaanslag IB, dagtekening 1 januari 2026, beoordelingstijdstip 11 februari 2026 (41 dagen) — is de aanslag invorderbaar?"
  waar: false
  toelichting: "Grensgeval: slechts 41 dagen verstreken; de termijn van zes weken is nog niet voltooid; invorderbaar: nee."
