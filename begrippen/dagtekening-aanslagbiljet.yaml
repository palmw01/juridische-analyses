begrip-id: BWBR0004770/art9/lid1/dagtekening-aanslagbiljet
begripsnaam: dagtekening-aanslagbiljet
aliases: []
soort: datum
soort-id: false
jas-klasse: tijdsaanduiding
toelichting-klasse: >-
  Dubbelclassificatie: (1) tijdsaanduiding — de dagtekening is het referentiepunt waarvan de invorderingstermijn
  van zes weken wordt berekend; (2) rechtsfeit — de dagtekening is de handeling (het formeel dateren/uitreiken
  van het aanslagbiljet) waaraan het rechtsgevolg (aanvang invorderingstermijn) is verbonden. Primaire
  classificatie: tijdsaanduiding, omdat het meetpunt in de voorwaardeconstructie van lid 1 centraal staat.
herkomst: direct
status: concept
definitie:
  kern: >-
    De op het aanslagbiljet vermelde datum waarop de belastingaanslag formeel is gedagtekend en die dient
    als het vaste referentiepunt voor de berekening van de invorderingstermijn
  contexten:
  - markering-id: m-002
    bijdrage: verfijning
    tekst: >-
      In de context van art. 9 lid 5 IW 1990 fungeert de dagtekening als het rekenkundige
      startpunt voor de berekening van N achtereenvolgende termijnvervaldagen — één maand na
      de dagtekening valt de eerste termijn, daarna telkens een maand later; de dagtekening
      is daarmee niet slechts het aanvangsmoment van een eenmalige termijn maar de generator
      van een reeks vervaldatums
    toelichting: >-
      In lid 1 bepaalt de dagtekening één moment (aanvang 6-weken-termijn); in lid 5 bepaalt
      diezelfde dagtekening via art. 9 lid 5 sub a de volledige termijnenreeks — een kwalitatief
      andere juridische rol van hetzelfde gegeven
definitie-versie: 2
