begripsnaam: betalingstermijn-aanslag
aliases: []
soort: tijdsduur
soort-id: false
jas-klasse: variabele
toelichting-klasse: >-
  De betalingstermijn is een kenmerk van de aanslag (het rechtsobject) waarvan de lengte — één maand
  of zes weken — bepalend is voor de vervaldagberekening. Variabele omdat de concrete waarde per aanslag
  kan verschillen.
herkomst: direct
status: concept
definitie:
  kern: >-
    De wettelijk of bij beschikking vastgestelde tijdsduur waarbinnen de belastingschuldige een aanslag
    moet betalen, uitgedrukt als één maand of als zes weken, en die bepalend is voor de keuze van de
    toepasselijke vervaldagberekeningsregel
