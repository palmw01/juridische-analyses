voorbeelden:
- stelling: "De bepalingen van de Algemene douanewet over de berekening van invoerrechten (heffing) vallen onder dit begrip?"
  waar: true
  toelichting: "Invoerrechten zijn rijksbelastingen; de heffingsbepalingen in de Algemene douanewet zijn wettelijke bepalingen bedoeld in art. 1:1 lid 1 en 2 ADW die betrekking hebben op de heffing van rijksbelastingen."
- stelling: "De bepalingen van de Algemene douanewet over douaneformaliteiten (aangifteprocedures) vallen onder dit begrip?"
  waar: false
  toelichting: "Grensgeval: douaneformaliteiten hebben geen betrekking op de heffing van rijksbelastingen maar op procedurele verplichtingen; de 'voor zover'-beperking sluit dergelijke bepalingen uit."
kenmerken:
- "Beperkt tot bepalingen die betrekking hebben op de heffing — niet op andere douanerechtelijke onderwerpen"
- "Verwijst via art. 1:1 lid 1 en 2 ADW naar specifieke wettelijke bepalingen"
- "Functioneert als schakelbepaling tussen IW 1990 en douanewetgeving"
