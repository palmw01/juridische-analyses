begrip-id: BWBR0004770/art2/lid2/wettelijke-regeling-betreffende-de-heffing-van-rijksbelastingen
begripsnaam: wettelijke regeling betreffende de heffing van rijksbelastingen
aliases: []
soort: entiteit
soort-id: false
jas-klasse: brondefinitie
toelichting-klasse: >-
  Onderdeel b definieert wat onder 'wettelijke regeling betreffende de heffing van rijksbelastingen'
  wordt verstaan voor de toepassing van de IW 1990. De definitie verwijst naar art. 1:1 lid 1 en 2
  Algemene douanewet en is beperkt tot douanerechtelijke bepalingen die betrekking hebben op heffing.
  Systematische interpretatiemethode: de definitie krijgt betekenis in samenhang met andere artikelen
  van de IW 1990 die deze term gebruiken.
herkomst: direct
status: concept
definitie:
  kern: >-
    De wettelijke bepalingen bedoeld in artikel 1:1, eerste en tweede lid, van de Algemene douanewet,
    voor zover deze betrekking hebben op de heffing van rijksbelastingen — met uitsluiting van
    douanerechtelijke bepalingen die geen betrekking hebben op heffing
  contexten: []
