begrip-id: BWBR0024096/par9-5/vervaldag-normaal-jaar-28-februari
begripsnaam: vervaldag-normaal-jaar-28-februari
aliases: []
soort: datum
soort-id: false
jas-klasse: tijdsaanduiding
toelichting-klasse: >-
  Standaard-uitkomst voor dagtekening 28 februari in een niet-schrikkeljaar: in een
  niet-schrikkeljaar is 28 februari de laatste dag van de maand, zodat de beperkingsregel
  van toepassing is voor de één-maandtermijn (31 maart) en de kalenderrekenregel voor de
  zes-wekentermijn (11 april). Dit is de hoofdzin van de tenzij-constructie waarvan
  AR-BWBR0024096-par9-5-c de specialisatieregel is.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De berekende vervaldag bij dagtekening 28 februari in een niet-schrikkeljaar: de
    één-maandtermijn vervalt op 31 maart (beperkingsregel: 28 februari is de laatste dag
    van de maand, volgmaand maart heeft 31 dagen) en de zes-wekentermijn vervalt op
    11 april (28 februari + 42 kalenderdagen)
  contexten: []
definitie-versie: 1
