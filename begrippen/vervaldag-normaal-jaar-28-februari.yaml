voorbeelden:
- stelling: "Dagtekening 28 februari 2025 (geen schrikkeljaar), betalingstermijn één maand — vervaldag is 31 maart 2025?"
  waar: true
  toelichting: "2025 is geen schrikkeljaar; 28 februari is de laatste dag van de maand; beperkingsregel: de dag die hetzelfde nummer draagt (28) bestaat in maart wel, maar de standaard voor de laatste dag van de maand is de laatste dag van de volgmaand = 31 maart."
- stelling: "Dagtekening 28 februari 2025 (geen schrikkeljaar), betalingstermijn zes weken — vervaldag is 11 april 2025?"
  waar: true
  toelichting: "2025 is geen schrikkeljaar; 28 februari + 42 dagen: februari heeft 28 dagen, resterende in februari = 0, maart 31 dagen: 0 + 31 = 31, april: 42 - 31 = 11. Vervaldatum: 11 april."
- stelling: "Dagtekening 28 februari 2024 (schrikkeljaar), betalingstermijn één maand — vervaldag is 31 maart 2024?"
  waar: false
  toelichting: "Grensgeval: 2024 is een schrikkeljaar; de specialisatieregel AR-BWBR0024096-par9-5-c is van toepassing: vervaldag is 28 maart (niet 31 maart). De hoofdregel AR-BWBR0024096-par9-5-e geldt niet in een schrikkeljaar."
kenmerken:
- "Hoofdregel voor het 28-februari-scenario: geldt uitsluitend in een niet-schrikkeljaar"
- "28 februari is in een niet-schrikkeljaar de laatste dag van de maand (beperkingsregel-trigger)"
- "Één maand: vervalt op 31 maart (laatste dag van de volgmaand)"
- "Zes weken: 28 + 42 = 70 dagen totaal; 28 februari + 42 = 11 april in 28-dagige februari"
- "Twee uitkomsten: 31 maart (één maand) of 11 april (zes weken)"
