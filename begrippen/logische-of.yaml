voorbeelden:
- stelling: "Aanslagtype is een voorlopige aanslag IB (waar) OF een voorlopige aanslag VPB (onwaar) — is de disjunctieve voorwaarde vervuld?"
  waar: true
  toelichting: "Ten minste één van de verbonden elementen is waar (IB-aanslag is waar); de logische-of-operator levert als uitkomst 'vervuld'."
- stelling: "Aanslagtype is noch een voorlopige aanslag IB noch een voorlopige aanslag VPB (beide onwaar) — is de disjunctieve voorwaarde vervuld?"
  waar: false
  toelichting: "Grensgeval: alle verbonden elementen zijn onwaar; de logische-of-operator levert als uitkomst 'niet vervuld'; de termijnenregeling van lid 5 is niet van toepassing."
