begrip-id: BWBR0004770/art9/lid5/logische-of
begripsnaam: logische-of
aliases: []
soort: tekst
soort-id: false
jas-klasse: operator
toelichting-klasse: >-
  Het voegwoord 'of' fungeert als logische OR-operator in de opsomming van aanslagtypen (IB of VPB) in
  lid 5. De voorwaarde is vervuld als sprake is van ofwel een voorlopige IB-aanslag ofwel een voorlopige
  VPB-aanslag.
herkomst: direct
status: concept
definitie:
  kern: >-
    De logische operator die twee of meer alternatieven verbindt, zodanig dat de samengestelde voorwaarde
    is vervuld als ten minste één van de verbonden elementen waar is
  contexten: []
