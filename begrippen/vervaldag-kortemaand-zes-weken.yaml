toelichting-klasse: >-
  Rekenregel die de vervaldag van een zes-wekentermijn bepaalt bij dagtekening 31 oktober: 42 dagen
  na 31 oktober = 12 december. Het voorbeeld verduidelijkt de kalenderrekenkundige methode voor de
  zes-wekenvariant.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De berekende vervaldag bij een betalingstermijn van zes weken en dagtekening 31 oktober,
    vastgesteld op 12 december omdat zes weken (42 dagen) na 31 oktober de 12e dag van december
    is; illustratie van de kalenderrekenkundige methode voor de zes-wekenvariant
