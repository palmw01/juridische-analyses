voorbeelden:
- stelling: "Vervaldag-kortemaand-zes-weken: dagtekening 31 oktober, betalingstermijn zes weken — vervaldag is 12 december?"
  waar: true
  toelichting: "31 oktober + 42 dagen = 12 december. De zes-weekentermijn wordt kalenderrekenkundig berekend als exact 42 kalenderdagen."
- stelling: "Vervaldag-kortemaand-zes-weken: dagtekening 15 oktober, betalingstermijn zes weken — vervaldag is 12 december?"
  waar: false
  toelichting: "Grensgeval: 15 oktober + 42 dagen = 26 november, niet 12 december. 12 december geldt uitsluitend bij dagtekening 31 oktober."
