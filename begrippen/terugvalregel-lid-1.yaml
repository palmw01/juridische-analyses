    relatie-soort: causaal
voorbeelden:
- stelling: "Voorlopige aanslag IB 2026, dagtekening december 2026 (0 resterende maanden) — is de terugvalregel actief?"
  waar: true
  toelichting: "Na december resteren 0 maanden; de termijnenberekening levert ≤ 1 termijn op; de terugvalregel is actief en art. 9 lid 1 herneemt: de aanslag is invorderbaar zes weken na dagtekening."
- stelling: "Voorlopige aanslag IB 2026, dagtekening april 2026 (8 resterende maanden) — is de terugvalregel actief?"
  waar: false
  toelichting: "Grensgeval: 8 resterende maanden leveren meer dan één termijn op; de terugvalregel is niet actief en de gelijke-termijnenregeling van lid 5 is van toepassing."
