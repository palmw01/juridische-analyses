begrip-id: BWBR0004770/art9/lid5/dagtekening-in-vaststellingsjaar
begripsnaam: dagtekening-in-vaststellingsjaar
aliases: []
soort: booleaans
soort-id: false
jas-klasse: voorwaarde
toelichting-klasse: >-
  Kwalificatieconditie die het toepassingsbereik van lid 5 afbakent: de dagtekening van het aanslagbiljet
  moet vallen in het belastingjaar waarover de voorlopige aanslag is vastgesteld. Aanslagen met een dagtekening
  vóór het belastingjaar vallen onder lid 7.
herkomst: direct
status: concept
definitie:
  kern: >-
    De toepassingsvoorwaarde dat de dagtekening van het aanslagbiljet valt binnen het kalenderjaar waarover
    de voorlopige aanslag of de voorlopige conserverende aanslag is vastgesteld, als afbakeningscriterium
    voor de termijnenregeling van art. 9 lid 5 IW 1990
  contexten: []
definitie-versie: 1
definitie-gebaseerd-op:
- m-001
markeringen:
- markering-id: m-001
  bron-annotatie-id: BWBR0004770/art9/lid5
  tekst: >-
    waarvan het aanslagbiljet een dagtekening heeft die ligt in het jaar waarover deze is vastgesteld
  interpretatiemethode: grammaticaal
  bijdrage: primair
  bevestigd: true
  bevestigd-op: '2026-05-15'
geldigheid-van: '2026-01-01'
geldigheid-tot: null
vervangen-door: null
relaties:
  is-een: []
  heeft:
  - begrip-id: BWBR0004770/art9/lid1/dagtekening-aanslagbiljet
    kardinaliteit: '1:1'
  leidt-tot:
  - begrip-id: BWBR0004770/art9/lid5/invorderbaarheid-in-gelijke-termijnen
    relatie-soort: causaal
voorbeelden:
- stelling: "Voorlopige aanslag IB 2026, aanslagbiljet gedagtekend 15 april 2026 — is dagtekening-in-vaststellingsjaar vervuld?"
  waar: true
  toelichting: "De dagtekening (april 2026) valt in het belastingjaar 2026 waarover de aanslag is vastgesteld; de toepassingsvoorwaarde is vervuld."
- stelling: "Voorlopige aanslag IB 2026, aanslagbiljet gedagtekend 15 januari 2027 — is dagtekening-in-vaststellingsjaar vervuld?"
  waar: false
  toelichting: "Grensgeval: de dagtekening (januari 2027) valt buiten het belastingjaar 2026; de termijnenregeling van art. 9 lid 5 IW 1990 is niet van toepassing."
