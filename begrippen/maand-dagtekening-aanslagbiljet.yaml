voorbeelden:
- stelling: "Aanslagbiljet gedagtekend op 15 april 2026 — is maand-dagtekening-aanslagbiljet gelijk aan april?"
  waar: true
  toelichting: "De maand in de dagtekening is april; na april resteren in 2026 nog 8 maanden (mei t/m december)."
- stelling: "Aanslagbiljet gedagtekend op 31 december 2026 — leidt maand-dagtekening-aanslagbiljet tot een termijnenberekening van meer dan één termijn?"
  waar: false
  toelichting: "Grensgeval: de maand in de dagtekening is december; na december resteren 0 maanden; de termijnenberekening leidt niet tot meer dan één termijn en de terugvalregel van art. 9 lid 5 derde volzin is van toepassing."
