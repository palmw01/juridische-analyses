soort: monetair-bedrag
soort-id: false
jas-klasse: variabele
toelichting-klasse: >-
  Impliciet attribuut van het rechtsobject 'een belastingaanslag' (art. 9 lid 1 IW 1990): de wetstekst
  vermeldt het totaalbedrag niet expliciet, maar elke belastingaanslag heeft een vastgesteld bedrag dat
  de invorderingsbasis vormt. Variabele (niet rechtsobject): het totaalbedrag is de numerieke waarde van
  de aanslag als invoer voor de termijnbedragberekening (AR-9-5f).
