voorbeelden:
- stelling: "Aanslagbiljet gedagtekend 15 maart 2026 — is een-maand-na-dagtekening gelijk aan 15 april 2026?"
  waar: true
  toelichting: "Één kalendermaand na 15 maart = 15 april 2026; de eerste termijn vervalt op 15 april 2026."
- stelling: "Aanslagbiljet gedagtekend 31 oktober 2026 — is een-maand-na-dagtekening gelijk aan 31 november 2026?"
  waar: false
  toelichting: "Grensgeval: 31 november bestaat niet; de beperkingsregel is van toepassing en stelt de vervaldag op de laatste dag van november = 30 november 2026."
