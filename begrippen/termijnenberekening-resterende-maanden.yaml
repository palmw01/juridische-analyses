begrip-id: BWBR0004770/art9/lid5/termijnenberekening-resterende-maanden
begripsnaam: termijnenberekening-resterende-maanden
aliases: []
soort: tijdsduur
soort-id: false
jas-klasse: afleidingsregel
toelichting-klasse: >-
  Rekenregel die het aantal invorderingstermijnen bepaalt. Input: maand van de dagtekening (tijdsaanduiding)
  en het resterende aantal kalendermaanden (variabele). Output: het exacte aantal gelijke maandelijkse
  termijnen. Logica: bij dagtekening in januari zijn er 11 termijnen; bij oktober 2, bij november 1 (terugval
  naar lid 1 via derde volzin).
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De rekenregel die het aantal gelijke invorderingstermijnen bepaalt door het aantal kalendermaanden
    te tellen dat in het belastingjaar resteert na de maand die in de dagtekening van het aanslagbiljet
    is vermeld
  contexten: []
definitie-versie: 1
definitie-gebaseerd-op:
- m-001
markeringen:
- markering-id: m-001
  bron-annotatie-id: BWBR0004770/art9/lid5
  tekst: >-
    in zoveel gelijke termijnen als er na de maand, die in de dagtekening van het aanslagbiljet is vermeld,
    nog maanden van het jaar overblijven
  interpretatiemethode: systematisch
  bijdrage: primair
  bevestigd: true
  bevestigd-op: '2026-05-15'
geldigheid-van: '2026-01-01'
geldigheid-tot: null
vervangen-door: null
relaties:
  is-een: []
  heeft:
  - begrip-id: BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet
    kardinaliteit: '1:1'
  - begrip-id: BWBR0004770/art9/lid5/resterende-maanden-jaar
    kardinaliteit: '1:1'
  leidt-tot:
  - begrip-id: BWBR0004770/art9/lid5/invorderbaarheid-in-gelijke-termijnen
    relatie-soort: causaal
voorbeelden:
- stelling: "Aanslagbiljet gedagtekend in april 2026 — levert termijnenberekening-resterende-maanden 8 termijnen op?"
  waar: true
  toelichting: "Na april resteren in 2026 nog 8 maanden (mei t/m december); de aanslag is invorderbaar in 8 gelijke maandelijkse termijnen."
- stelling: "Aanslagbiljet gedagtekend in december 2026 — levert termijnenberekening-resterende-maanden meer dan één termijn op?"
  waar: false
  toelichting: "Grensgeval: na december resteren 0 maanden; de berekening leidt niet tot meer dan één termijn en de terugvalregel van art. 9 lid 5 derde volzin activeert art. 9 lid 1."
