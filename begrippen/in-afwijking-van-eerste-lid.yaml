voorbeelden:
- stelling: "Voorlopige aanslag IB 2026 gedagtekend in april 2026 — verdringt de termijnenregeling van lid 5 de zes-wekenregel van lid 1?"
  waar: true
  toelichting: "De toepassingsvoorwaarden van art. 9 lid 5 IW 1990 zijn vervuld; de lex-specialis-bepaling 'in afwijking van het eerste lid' is actief en de aanslag is invorderbaar in gelijke maandelijkse termijnen."
- stelling: "Definitieve aanslag IB 2026 gedagtekend in april 2026 — verdringt de termijnenregeling van lid 5 de zes-wekenregel van lid 1?"
  waar: false
  toelichting: "Grensgeval: een definitieve aanslag valt niet binnen de opsomming van aanslagtypen in art. 9 lid 5 IW 1990; de lex-specialis is niet van toepassing en de hoofdregel van lid 1 (invorderbaar zes weken na dagtekening) geldt."
