begrip-id: BWBR0004770/art2/lid2/invorderen-van-rijksbelastingen
begripsnaam: invorderen van rijksbelastingen
aliases: []
soort: entiteit
soort-id: false
jas-klasse: brondefinitie
toelichting-klasse: >-
  Art. 2 lid 2 sub e geeft via de constructie 'verstaat mede onder' een grammaticale uitbreiding
  van het begrip 'invorderen van rijksbelastingen': ook het betalen van een terug te geven bedrag
  valt eronder. De kern omvat zowel de hoofdbetekenis (het innen van belastingschulden) als deze
  wettelijke uitbreiding naar teruggaven. De contra-intuïtieve uitbreiding is opmerkelijk: in
  alledaags en juridisch taalgebruik ziet 'invorderen' uitsluitend op het innen van schulden.
herkomst: direct
status: concept
definitie:
  kern: >-
    Het door de ontvanger uitoefenen van bevoegdheden tot inning van verschuldigde rijksbelastingen,
    alsmede — ingevolge art. 2 lid 2 sub e IW 1990 — het betalen van een terug te geven bedrag
    aan rijksbelastingen, zodat de IW 1990 ook op teruggaafprocedures van toepassing is
  contexten: []
