voorbeelden:
- stelling: "De ontvanger betaalt een teruggaaf IB 2024 uit aan een belastingschuldige — valt dit onder invorderen van rijksbelastingen in de zin van art. 2 lid 2 sub e IW 1990?"
  waar: true
  toelichting: "De uitbetaling van een teruggaaf rijksbelasting door de ontvanger is expliciet opgenomen in de uitgebreide definitie van onderdeel e; de IW 1990 is van toepassing op deze handeling."
- stelling: "De ontvanger vordert een openstaande belastingschuld in bij een belastingschuldige — valt dit onder invorderen van rijksbelastingen in de zin van art. 2 lid 2 sub e IW 1990?"
  waar: false
  toelichting: "Grensgeval: onderdeel e definieert uitsluitend de uitbreiding naar teruggaven; het innen van belastingschulden valt onder de hoofdbetekenis van 'invorderen' (buiten onderdeel e). Onderdeel e voegt aan die hoofdbetekenis de teruggaafuitbetaling toe — het vervangt de hoofdbetekenis niet."
kenmerken:
