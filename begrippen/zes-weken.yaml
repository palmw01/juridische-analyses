voorbeelden:
- stelling: "Termijn van zes weken eindigt op een zondag — is de belastingaanslag toch op die zondag invorderbaar?"
  waar: true
  toelichting: "Art. 9 lid 10 IW 1990 sluit de Algemene termijnenwet uitdrukkelijk uit; de termijn van zes weken loopt kalenderstrikt door zonder verlenging voor weekenden of feestdagen."
- stelling: "Een betalingstermijn van zeven weken is een zes-weken-termijn in de zin van art. 9 lid 1 IW 1990?"
  waar: false
  toelichting: "Grensgeval: de hoofdregel van art. 9 lid 1 kent uitsluitend een termijn van zes weken (42 kalenderdagen); een betalingstermijn van zeven weken is geen zes-weken-termijn."
