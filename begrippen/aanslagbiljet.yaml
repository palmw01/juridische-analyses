  kern: >-
    De kennisgeving van de beschikking of uitspraak bedoeld in art. 2 lid 2 sub c IW 1990 — het
    formele document waarmee de belastingaanslag aan de belastingschuldige bekend wordt gemaakt
  contexten: []
