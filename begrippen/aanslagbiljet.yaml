voorbeelden:
- stelling: "Het schriftelijk bericht van de Belastingdienst waarop de aanslag IB 2024 staat vermeld met het te betalen bedrag, is een aanslagbiljet?"
  waar: true
  toelichting: "Het bericht is de kennisgeving van de beschikking (belastingaanslag) in de zin van onderdeel c; het maakt de aanslag formeel bekend aan de belastingschuldige."
- stelling: "Een herinneringsbrief van de Belastingdienst voor een nog openstaande schuld is een aanslagbiljet?"
  waar: false
  toelichting: "Grensgeval: een herinneringsbrief is geen kennisgeving van een beschikking of uitspraak in de zin van onderdeel c — de beschikking is al eerder per aanslagbiljet bekendgemaakt; de herinneringsbrief is een aanmaning, geen aanslagbiljet."
