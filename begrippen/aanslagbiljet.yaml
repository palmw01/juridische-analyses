jas-klasse: brondefinitie
toelichting-klasse: >-
  Onderdeel d definieert 'aanslagbiljet' als de kennisgeving (het document) van de beschikking of
  uitspraak bedoeld in onderdeel c. Het aanslagbiljet is het formele document waarmee de belastingaanslag
  (in de uitgebreide zin van onderdeel c) aan de belastingschuldige bekend wordt gemaakt.
  Grammaticaal herkenbaar als begripsdefinitie via de dubbele punt-constructie.
herkomst: direct
