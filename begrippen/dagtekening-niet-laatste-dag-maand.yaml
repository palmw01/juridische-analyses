jas-klasse: voorwaarde
toelichting-klasse: >-
  Derde en algemene scenario: de dagtekening valt niet op de laatste dag van de kalendermaand. Deze
  voorwaarde sluit aan op de eerstgenoemde gevallen (31 oktober, 28 februari) en formuleert de
  toepassingssfeer van de algemene rekenregel voor de resterende gevallen.
herkomst: direct
status: concept
definitie:
  kern: >-
    De toepassingsvoorwaarde die is vervuld wanneer de dagtekening van het aanslagbiljet valt op
    een andere dag dan de laatste dag van de kalendermaand; in dat geval vervalt de één-maandtermijn
    op de dag in de volgmaand met hetzelfde dagnummer als de dagtekening (de 'zelfde-dagnummer'-regel)
  contexten: []
