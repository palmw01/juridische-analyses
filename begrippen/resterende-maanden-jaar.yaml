    relatie-soort: causaal
voorbeelden:
- stelling: "Aanslagbiljet gedagtekend in april 2026 — is resterende-maanden-jaar gelijk aan 8?"
  waar: true
  toelichting: "Na de dagtekeningmaand april resteren in 2026 nog 8 kalendermaanden: mei, juni, juli, augustus, september, oktober, november en december."
- stelling: "Aanslagbiljet gedagtekend in november 2026 — is resterende-maanden-jaar gelijk aan 1?"
  waar: true
  toelichting: "Na november resteert in 2026 nog 1 maand (december); dit is een grensgeval: met precies 1 resterende maand is de termijnenberekening ≤ 1 en herneemt art. 9 lid 1 via de terugvalregel."
