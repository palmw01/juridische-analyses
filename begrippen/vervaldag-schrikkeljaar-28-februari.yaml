voorbeelden:
- stelling: "Vervaldag-schrikkeljaar-28-februari: dagtekening 28 februari 2024 (schrikkeljaar), betalingstermijn één maand — vervaldag is 28 maart 2024?"
  waar: true
  toelichting: "2024 is een schrikkeljaar; 28 februari is niet de laatste dag (29 februari bestaat); zelfde-dagnummer-regel: één maand later = 28 maart."
- stelling: "Vervaldag-schrikkeljaar-28-februari: dagtekening 28 februari 2025 (geen schrikkeljaar), betalingstermijn één maand — vervaldag is 28 maart 2025?"
  waar: false
  toelichting: "Grensgeval: 2025 is geen schrikkeljaar; 28 februari is de laatste dag van de maand; beperkingsregel: vervaldag = 31 maart, niet 28 maart."
