- "Schrikkeljaareffect: 28 februari is niet de laatste dag van de maand in een schrikkeljaar"
- "Twee uitkomsten: 28 maart (één maand) of 10 april (zes weken)"
- "28 februari + 42 dagen = 10 april in een schrikkeljaar (februari heeft 29 dagen)"
