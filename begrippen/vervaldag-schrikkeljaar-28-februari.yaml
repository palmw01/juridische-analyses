begrip-id: BWBR0024096/par9-5/vervaldag-schrikkeljaar-28-februari
begripsnaam: vervaldag-schrikkeljaar-28-februari
aliases: []
soort: datum
soort-id: false
jas-klasse: afleidingsregel
toelichting-klasse: >-
  Rekenregel voor het schrikkeljaarscenario bij dagtekening 28 februari: in een schrikkeljaar is 28
  februari niet de laatste dag van de maand, zodat de vervaldag één maand later (28 maart) of zes
  weken later (10 april) valt. 'Dan wel' is een disjunctieve operator die de twee termijnvarianten
  (één maand / zes weken) onderscheidt.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De berekende vervaldag bij dagtekening 28 februari in een schrikkeljaar: de één-maandtermijn
    vervalt op 28 maart en de zes-wekentermijn vervalt op 10 april; deze afwijkende uitkomst geldt
    omdat 28 februari in een schrikkeljaar niet de laatste dag van de maand is, zodat de
    zelfde-dagnummer-regel van toepassing is in plaats van de beperkingsregel
  contexten: []
