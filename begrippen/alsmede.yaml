soort: tekst
soort-id: false
jas-klasse: operator
toelichting-klasse: >-
  De conjunctieve operator 'alsmede' verbindt de opsomming van de bij rijksbelastingen mede inbegrepen
  posten (belastingrente, revisierente, rente op achterstallen, kosten van ambtelijke werkzaamheden)
  met het laatste element (bestuurlijke boeten). Logisch type: EN-additief.
herkomst: direct
status: concept
definitie:
  kern: >-
    Conjunctieve operator die de laatste term in een opsomming additief verbindt met de voorgaande
    termen, zodanig dat alle genoemde elementen tezamen gelden; logisch equivalent aan EN in een
    gesloten opsomming
  contexten: []
