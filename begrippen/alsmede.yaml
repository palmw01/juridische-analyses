voorbeelden:
- stelling: "'Alsmede' in de opsomming belastingrente, revisierente, rente op achterstallen, kosten ambtelijke werkzaamheden, alsmede bestuurlijke boeten — zijn alle genoemde elementen inbegrepen?"
  waar: true
  toelichting: "De conjunctieve operator 'alsmede' voegt het laatste element (bestuurlijke boeten) additief toe aan de voorgaande opsomming; alle vijf elementen zijn inbegrepen onder rijksbelastingen."
- stelling: "'Alsmede' werkt als een exclusieve keuze — het laatste element sluit de voorgaande elementen uit?"
  waar: false
  toelichting: "Grensgeval: 'alsmede' is additief (EN), niet disjunctief (OF of DAN WEL). Het voegt het laatste element toe zonder de voorgaande te vervangen of uit te sluiten."
kenmerken:
