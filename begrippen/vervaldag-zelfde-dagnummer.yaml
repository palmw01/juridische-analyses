    relatie-soort: causaal
voorbeelden:
- stelling: "Vervaldag-zelfde-dagnummer: dagtekening 15 maart, betalingstermijn één maand — vervaldag is 15 april?"
  waar: true
  toelichting: "15 maart + één maand = 15 april (hetzelfde dagnummer in de volgmaand). 15 april bestaat; de zelfde-dagnummer-regel is van toepassing."
- stelling: "Vervaldag-zelfde-dagnummer: dagtekening 31 oktober, betalingstermijn één maand — vervaldag is 31 november?"
  waar: false
  toelichting: "Grensgeval: 31 november bestaat niet; de zelfde-dagnummer-regel kan niet worden toegepast; de beperkingsregel vervangt de uitkomst door 30 november."
kenmerken:
- "Hoofdregel voor één-maandtermijnen bij dagtekeningen niet op de laatste dag van de maand"
- "Berekening: dag D van maand M → dag D van maand M+1"
- "Toepasselijk wanneer de volgmaand de dag met hetzelfde nummer wél bevat"
- "Lex generalis ten opzichte van de beperkingsregel (31 oktober) en schrikkeljaar-uitzondering (28 februari)"
