begrip-id: BWBR0024096/par9-5/vervaldag-zelfde-dagnummer
begripsnaam: vervaldag-zelfde-dagnummer
aliases: []
soort: datum
soort-id: false
jas-klasse: afleidingsregel
toelichting-klasse: >-
  Algemene rekenregel voor de één-maandtermijn: de vervaldag is de dag in de volgende kalendermaand
  met hetzelfde dagnummer als de dagtekening. Dit is de hoofdregel waarvan de 31-oktober- en
  28-februari-voorbeelden specifieke toepassingen zijn.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    De berekende vervaldag van een betalingstermijn van één maand, vastgesteld op de dag in de
    kalendermaand die één maand na de dagtekening valt en die hetzelfde dagnummer draagt als de
    dagtekening van het aanslagbiljet; toepasselijk wanneer de dagtekening niet op de laatste
    dag van de kalendermaand valt
  contexten: []
definitie-versie: 1
definitie-gebaseerd-op:
- m-001
markeringen:
- markering-id: m-001
  bron-annotatie-id: BWBR0024096/par9-5
  tekst: "vervalt de termijn een maand later (bij een betalingstermijn van een maand) op de dag die hetzelfde nummer heeft als dat van de dagtekening"
  interpretatiemethode: grammaticaal
  bijdrage: primair
  bevestigd: true
  bevestigd-op: '2026-05-15'
geldigheid-van: "2026-01-01"
