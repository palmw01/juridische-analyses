voorbeelden:
- stelling: "Betalingstermijn-een-maand-of-zes-weken: aanslag met betalingstermijn van één maand — is voorwaarde vervuld?"
  waar: true
  toelichting: "De betalingstermijn is gesteld op één maand, dat is één van de twee toegestane termijnlengtes."
- stelling: "Betalingstermijn-een-maand-of-zes-weken: aanslag met betalingstermijn van zes weken — is voorwaarde vervuld?"
  waar: true
  toelichting: "De betalingstermijn is gesteld op zes weken, dat is de tweede toegestane termijnlengte."
- stelling: "Betalingstermijn-een-maand-of-zes-weken: aanslag met betalingstermijn van twee maanden — is voorwaarde vervuld?"
  waar: false
  toelichting: "Grensgeval: twee maanden is geen van de twee alternatieve termijnlengtes; de rekenregels van sectie 9.5 zijn niet van toepassing."
kenmerken:
- "Disjunctieve toepassingsdrempel: óf één maand óf zes weken"
- "Exclusief: andere termijnlengtes vallen buiten het bereik van sectie 9.5 LI 2008"
- "Sluit aan bij art. 9 lid 1 IW 1990 (zes weken) en betalingstermijnen die bij beschikking op één maand zijn gesteld"
