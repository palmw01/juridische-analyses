begrip-id: BWBR0024096/par9-5/betalingstermijn-een-maand-of-zes-weken
begripsnaam: betalingstermijn-een-maand-of-zes-weken
aliases: []
soort: booleaans
soort-id: false
jas-klasse: voorwaarde
toelichting-klasse: >-
  De 'Als'-constructie introduceert de toepassingsdrempel van de gehele sectie: de rekenregels zijn
  uitsluitend van toepassing op betalingstermijnen van één maand of zes weken. De disjunctieve 'of'
  markeert twee alternatieve toepassingsgevallen.
herkomst: direct
status: concept
definitie:
  kern: >-
    De toepassingsvoorwaarde die is vervuld wanneer de betalingstermijn van een aanslag is gesteld
    op één maand of op zes weken; buiten deze twee gevallen zijn de rekenregels van sectie 9.5 LI
    2008 niet van toepassing
  contexten: []
definitie-versie: 1
