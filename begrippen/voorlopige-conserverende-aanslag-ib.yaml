voorbeelden:
- stelling: "Conserverende aanslag IB 2026 opgelegd bij emigratie, gedagtekend in april 2026 — is dit een voorlopige-conserverende-aanslag-ib in de zin van art. 9 lid 5 IW 1990?"
  waar: true
  toelichting: "De aanslag is een conserverende aanslag IB van voorlopige aard, gedagtekend in het belastingjaar 2026; voldoet aan beide criteria van art. 9 lid 5 IW 1990 en is invorderbaar in gelijke maandelijkse termijnen."
- stelling: "Conserverende aanslag VPB 2026 opgelegd bij staking van een vennootschap — is dit een voorlopige-conserverende-aanslag-ib?"
  waar: false
  toelichting: "Grensgeval: art. 9 lid 5 IW 1990 noemt uitsluitend de voorlopige conserverende aanslag in de inkomstenbelasting; een conserverende aanslag VPB valt niet onder deze omschrijving."
