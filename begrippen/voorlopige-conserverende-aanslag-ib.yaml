begrip-id: BWBR0004770/art9/lid5/voorlopige-conserverende-aanslag-ib
begripsnaam: voorlopige-conserverende-aanslag-ib
aliases: []
soort: enumeratie
soort-id: false
jas-klasse: rechtsobject
toelichting-klasse: >-
  Naast de reguliere voorlopige aanslag IB/VPB benoemt lid 5 afzonderlijk de voorlopige conserverende
  aanslag IB als tweede aanslagtype waarvoor de termijnenregeling geldt. Het is een conserverende aanslag
  die belastinguitstel bij emigratie of vergelijkbare situaties beoogt te verzekeren.
herkomst: direct
status: concept
definitie:
  kern: >-
    Een belastingaanslag in de inkomstenbelasting van voorlopige en conserverende aard, die — mits het
    aanslagbiljet is gedagtekend in het belastingjaar waarover hij is vastgesteld — invorderbaar is in
    gelijke maandelijkse termijnen overeenkomstig art. 9 lid 5 IW 1990
  contexten: []
