toelichting-klasse: >-
  Onderdeel a breidt de definitie van 'rijksbelastingen' uit artikel 2 lid 1 sub a uit via de constructie
  'verstaat mede onder'. De uitbreiding omvat bijkomende publiekrechtelijke geldschulden (belastingrente,
  revisierente, rente op achterstallen, kosten van ambtelijke werkzaamheden, bestuurlijke boeten) die voor
  de toepassing van de IW 1990 gelijkgesteld worden met rijksbelastingen. Classificatie als brondefinitie:
  de term wordt expliciet omschreven in de wetstekst.
herkomst: direct
status: concept
definitie:
  kern: >-
    Een gesloten opsomming van publiekrechtelijke geldschulden die voor de toepassing van de
    Invorderingswet 1990 worden gelijkgesteld met belastingen geheven door het Rijk: de belastingrente,
    de revisierente, de rente op achterstallen, de kosten van ambtelijke werkzaamheden en de bestuurlijke
    boeten
