voorbeelden:
- stelling: "Aanslagbiljet gedagtekend 1 januari 2026, beoordelingstijdstip 12 februari 2026 (42 dagen later) — is zes-weken-na-dagtekening-aanslagbiljet vervuld?"
  waar: true
  toelichting: "Zes weken = 42 kalenderdagen; het beoordelingstijdstip (12 februari) ligt op de 42e dag na de dagtekening (1 januari); de tijdsconditie is vervuld."
- stelling: "Aanslagbiljet gedagtekend 1 januari 2026, beoordelingstijdstip 11 februari 2026 (41 dagen) — is zes-weken-na-dagtekening-aanslagbiljet vervuld?"
  waar: false
  toelichting: "Grensgeval: 41 dagen is minder dan 42 (zes weken); de tijdsconditie is nog niet vervuld en de aanslag is nog niet invorderbaar."
