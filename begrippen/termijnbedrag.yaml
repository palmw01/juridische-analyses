begrip-id: BWBR0004770/art9/lid5/termijnbedrag
begripsnaam: termijnbedrag
aliases: []
soort: monetair-bedrag
soort-id: false
jas-klasse: variabele
toelichting-klasse: >-
  Het adjectief 'gelijke' in de wetstekst is de gelijkheidseis die het termijnbedrag als afgeleide variabele
  fundeert: alle termijnen zijn gelijk in hoogte, zodat termijnbedrag = bedrag van de aanslag ÷ aantal termijnen.
  Variabele (niet afleidingsregel): dit is het uitvoerbegrip van AR-9-5f, niet de berekeningsregel zelf.
herkomst: afgeleid
status: concept
definitie:
  kern: >-
    Het bedrag van een afzonderlijke termijn, berekend door het bedrag van de belastingaanslag te
    delen door het aantal termijnen
  contexten: []
definitie-versie: 1
definitie-gebaseerd-op:
- m-001
markeringen:
