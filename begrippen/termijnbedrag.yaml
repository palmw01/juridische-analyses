voorbeelden:
- stelling: "Voorlopige aanslag IB 2026 bedraagt € 6.000; resterende-maanden-jaar = 6 — is termijnbedrag gelijk aan € 1.000?"
  waar: true
  toelichting: "€ 6.000 ÷ 6 termijnen = € 1.000 per termijn; alle termijnen zijn gelijk van hoogte conform de gelijkheidseis van art. 9 lid 5 IW 1990."
- stelling: "Voorlopige aanslag IB 2026 bedraagt € 6.000; maar de belastingplichtige betaalt de eerste termijn voor de dagtekening — is het termijnbedrag dan lager?"
  waar: false
  toelichting: "Grensgeval: het termijnbedrag wordt bepaald door aanslag gedeeld door aantal termijnen; vooruitbetalingen hebben geen invloed op de hoogte van het wettelijke termijnbedrag."
