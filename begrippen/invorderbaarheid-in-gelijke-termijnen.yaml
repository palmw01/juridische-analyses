definitie: De specialisatieregel die bepaalt dat een voorlopige aanslag IB of VPB,
  dan wel een voorlopige conserverende aanslag IB, waarvan het aanslagbiljet is gedagtekend
  in het belastingjaar, invorderbaar is in een aantal gelijke maandelijkse termijnen
  dat gelijk is aan het aantal kalendermaanden dat na de dagtekening maand nog in
  dat jaar resteert
definitie-versie: 1
