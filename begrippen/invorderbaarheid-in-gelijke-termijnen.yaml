- markering-id: m-001
  bron-annotatie-id: BWBR0004770/art9/lid5
  tekst: In afwijking van het eerste lid is een voorlopige aanslag in de inkomstenbelasting
    of in de vennootschapsbelasting en een voorlopige conserverende aanslag in de
    inkomstenbelasting, waarvan het aanslagbiljet een dagtekening heeft die ligt in
    het jaar waarover deze is vastgesteld, invorderbaar in zoveel gelijke termijnen
    als er na de maand, die in de dagtekening van het aanslagbiljet is vermeld, nog
    maanden van het jaar overblijven.
