voorbeelden:
- stelling: "Aanslag inkomstenbelasting 2024 opgelegd aan een particulier is een belastingaanslag?"
  waar: true
  toelichting: "De aanslag IB 2024 is een geformaliseerd besluit tot vaststelling van de belastingschuld; de ontvanger is bevoegd invordering in te stellen."
- stelling: "Een incassobrief van de Belastingdienst voor een achterstallige betaling is een belastingaanslag?"
  waar: false
  toelichting: "Grensgeval: een incassobrief is geen besluit tot vaststelling van een belastingschuld in de zin van art. 2 AWR; het is geen geformaliseerde aanslag en daarmee geen voorwerp van invordering in de zin van art. 9 IW 1990."
