begrip-id: BWBR0004770/art9/lid1/belastingaanslag
begripsnaam: belastingaanslag
aliases: []
soort: enumeratie
soort-id: false
jas-klasse: brondefinitie
toelichting-klasse: >-
  Art. 2 lid 2 sub c IW 1990 geeft de formele wettelijke definitie van 'belastingaanslag' — deze
  brondefinitie is leidend voor de definitiekern. Art. 9 lid 1 IW 1990 gebruikt de term als rechtsobject
  (voorwerp van de invorderingsrechtsbetrekking) maar definieert hem niet; die invorderingsrechtelijke
  rol is vastgelegd als verfijning-context.
herkomst: direct
status: concept
definitie:
  kern: >-
    Een ingevolge de Algemene wet inzake rijksbelastingen, de Algemene douanewet of enige andere
    wettelijke regeling betreffende de heffing van rijksbelastingen vastgestelde beschikking of
    uitspraak, strekkende tot al dan niet nadere vaststelling van een ingevolge die regelingen
    verschuldigd of terug te geven bedrag
  contexten:
  - markering-id: m-001
    bijdrage: verfijning
    tekst: >-
      In de invorderingsrechtsbetrekking van art. 9 lid 1 IW 1990 functioneert de belastingaanslag
      als rechtsobject: het is het voorwerp waarop de invorderingsbevoegdheid van de ontvanger
      zich richt zodra de betalingstermijn is verstreken
    toelichting: >-
      Art. 9 lid 1 specificeert de toepassingscontext: de belastingaanslag als afdwingbare
      titel voor de ontvanger. Deze invorderingsrechtelijke rol is een verfijning van de kern —
      de formele definitie (art. 2 lid 2c) is breder en omvat ook teruggaafbeschikkingen.
definitie-versie: 2
definitie-gebaseerd-op:
- m-002
