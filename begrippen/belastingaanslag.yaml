jas-klasse: rechtsobject
toelichting-klasse: >-
  De belastingaanslag is het voorwerp van de invorderingsrechtsbetrekking; grammaticaal is 'een belastingaanslag'
  het zelfstandig naamwoord waarop de invorderbaarheid betrekking heeft. Alternatieve classificatie als
  rechtssubject is uitgesloten: de aanslag is geen drager van rechten of plichten.
herkomst: direct
status: concept
definitie:
  kern: >-
    Een door de Belastingdienst opgelegd en geformaliseerd besluit tot vaststelling van een belastingschuld,
    dat als voorwerp van invordering dient en waarop de invorderingsrechtsbetrekking zich richt
