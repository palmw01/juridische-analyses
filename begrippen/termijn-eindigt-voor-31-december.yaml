voorbeelden:
- stelling: "Voorlopige aanslag IB 2026, laatste termijn berekend op 15 oktober 2026 — is termijn-eindigt-voor-31-december waar?"
  waar: true
  toelichting: "15 oktober 2026 valt vóór 31 december 2026; de LI 2008 §9.1-regel is van toepassing en de vervaldag wordt op 31 december gesteld."
- stelling: "Voorlopige aanslag IB 2026, laatste termijn berekend op 31 december 2026 — is termijn-eindigt-voor-31-december waar?"
  waar: false
  toelichting: "Grensgeval: de laatste termijn valt op 31 december zelf, niet vóór 31 december; de voorwaarde 'eindigt voor 31 december' is niet vervuld en de bijzondere vervaldag-regel wordt niet getriggerd."
