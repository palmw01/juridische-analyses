[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
markers = [
    "e2e: end-to-end tests (traag, apart uitvoeren)",
    "snapshot: snapshot-regressietests",
]

[tool.coverage.run]
source = ["tools", "sitegen"]
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
show_missing = true
# Sprint 5 baseline: 30% — validate_note 100%, data 100%, jas_index 100%, config 100%
# Volgende stap: sitegen/pages + rdf-tools (doel 65%)
fail_under = 28
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
