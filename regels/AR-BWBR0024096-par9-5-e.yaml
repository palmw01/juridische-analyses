formele-regel: |
  vervaldag-normaal-jaar-28-februari bedraagt ten hoogste 31 maart
  indien aan alle volgende voorwaarden is voldaan:
  - de dagtekening van het aanslagbiljet is gelijk aan 28 februari
  - het schrikkeljaar-voorbehoud is niet van toepassing (het jaar is geen schrikkeljaar)
  - de betalingstermijn-een-maand-of-zes-weken is vervuld met één maand
  [toelichting: in een niet-schrikkeljaar is 28 februari de laatste dag van de maand;
   de beperkingsregel stelt de vervaldatum op de laatste bestaande dag van de volgmaand,
   zijnde 31 maart]
toelichting: |
  Herleidbaar tot LI 2008 sectie 9.5, tweede rekenscenario (normaal-jaarvariant, één maand).

  De sectie bepaalt: "Als de dagtekening 28 februari is, dan vervalt de betalingstermijn
  van een maand op 31 maart … tenzij het jaartal aangeeft dat het een schrikkeljaar is."

  In een niet-schrikkeljaar heeft februari 28 dagen; 28 februari is de laatste dag van de
  maand. De beperkingsregel voor de één-maandtermijn is dan van toepassing: de dag die
  hetzelfde nummer draagt als de dagtekening (28) zou in maart op 28 maart vallen, maar
  de LI stelt de vervaldag voor het normaal-jaar-geval op 31 maart. Dit is de
  beperkingsregel voor het geval dat de dagtekening de laatste dag van de maand is: de
  vervaldag is de laatste dag van de volgmaand.

  De 'tenzij'-constructie markeert de schrikkeljaar-specialisatieregel (AR-BWBR0024096-par9-5-c)
  als uitzondering op déze hoofdregel. Deze regel is de lex generalis; de specialisatieregel
  heeft prioriteit 1 en overschrijft deze uitkomst in schrikkeljaren.

  Grammaticale interpretatie: de tekst stelt letterlijk 'vervalt de betalingstermijn van
  een maand op 31 maart' bij dagtekening 28 februari (hoofdzin, normaal jaar).
