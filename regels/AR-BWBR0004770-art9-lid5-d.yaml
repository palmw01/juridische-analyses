formele-regel: '**vervaldag-volgende-termijnen moet berekend worden als**

  vervaldag vorige termijn plus één kalendermaand


  *(iteratief toe te passen voor elke termijn na de eerste, totdat alle termijnen
  zijn vastgesteld)*'
toelichting: 'Herleidbaar tot art. 9 lid 5 IW 1990, tweede volzin: *"elk van de volgende
  termijnen telkens een maand later."*


  Grammaticale interpretatie: de vervaldatum van elke termijn na de eerste wordt berekend
  door één kalendermaand op te tellen bij de vervaldatum van de vorige termijn. De
  berekening is iteratief en wordt herhaald voor elke volgende termijn. Invoer voor
  de eerste iteratie is de uitkomst van AR-9-5c (vervaldag eerste termijn). Art. 9
  lid 10 IW 1990 sluit de Algemene termijnenwet uit.'
