formele-regel: 'In afwijking van vaststellen betalingstermijn belastingaanslag:

  [[begrippen/vervaldag-laatste-dag-maand]] is laatste dag van de maand

  indien aan alle volgende voorwaarden is voldaan:

  - [[begrippen/voorlopige-aanslag]] is van toepassing

  - [[begrippen/afwijkend-boekjaar]] is waar'
toelichting: Voor belastingplichtigen met een afwijkend boekjaar wordt de laatste
  vervaldag van een voorlopige aanslag altijd gesteld op de laatste dag van de maand
  waarin deze valt.
voorbeeldreeksen:
- invoerwaarden: BV met boekjaar van 1 april tot 31 maart, laatste termijn valt op
    15 maart
  verwachte-uitkomst: ja
  juridisch-juist: false
  toelichting: 15 maart
- invoerwaarden: Natuurlijk persoon met regulier kalenderjaar
  verwachte-uitkomst: nee
  juridisch-juist: false
  toelichting: datum volgens art. 9 lid 5 IW 1990
- invoerwaarden: BV met boekjaar 1 april - 31 maart, laatste termijn valt op 28 februari
  verwachte-uitkomst: ja
  juridisch-juist: false
  toelichting: 28 februari
tussenresultaat: false
