regel-id: AR-BWBR0004770-art9-lid5-b
naam: berekenen resterende maanden jaar
soort: Rekenregel
bwb-id: BWBR0004770
artikel: '9'
lid: '5'
peildatum: '2026-01-01'
geldigheid-van: '2026-01-01'
annotatie-id: BWBR0004770/art9/lid5
rechtsfeit-id: BWBR0004770/art9/lid1/dagtekening-aanslagbiljet
invoer:
- BWBR0004770/art9/lid5/maand-dagtekening-aanslagbiljet
uitvoer:
- BWBR0004770/art9/lid5/resterende-maanden-jaar
operators:
- min
formele-regel: '**resterende-maanden-jaar moet berekend worden als**

  12 min maand-dagtekening-aanslagbiljet


  *(waarbij de maand wordt uitgedrukt als ordegetal: januari = 1, februari = 2, …,
  december = 12)*'
toelichting: 'Herleidbaar tot art. 9 lid 5 IW 1990, eerste volzin: *"in zoveel gelijke
  termijnen als er na de maand, die in de dagtekening van het aanslagbiljet is vermeld,
  nog maanden van het jaar overblijven."*


  Grammaticale interpretatie: het aantal maanden dat na de dagtekening-maand nog in
  het jaar overblijft, is gelijk aan 12 minus het ordegetal van de dagtekening-maand.
  Bij dagtekening in januari (maand 1) zijn er 11 resterende maanden; bij december
  (maand 12) zijn er 0.


  De rekenregel produceert een tussenresultaat (`resterende-maanden-jaar`) dat als
  invoer dient voor de beslissing of de specialisatieregel (AR-9-5a) of de terugvalregel
  (AR-9-5e) van toepassing is.'
voorbeeldreeksen:
- invoerwaarden: 'maand-dagtekening: januari (1)'
  verwachte-uitkomst: 'resterende-maanden-jaar: 11'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'maand-dagtekening: oktober (10)'
  verwachte-uitkomst: 'resterende-maanden-jaar: 2'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'maand-dagtekening: november (11)'
  verwachte-uitkomst: 'resterende-maanden-jaar: 1'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'maand-dagtekening: december (12)'
  verwachte-uitkomst: 'resterende-maanden-jaar: 0'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'maand-dagtekening: november (11)'
  verwachte-uitkomst: 'resterende-maanden-jaar: 2 (tellen nov en dec)'
  juridisch-juist: false
  toelichting: 'Grensgeval: november geeft 1 resterende maand (dec), niet 2. "Na de
    maand die in de dagtekening is vermeld" — de dagtekening-maand telt niet mee.'
