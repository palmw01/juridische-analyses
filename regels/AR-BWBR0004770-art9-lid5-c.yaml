formele-regel: '**vervaldag-eerste-termijn moet berekend worden als**

  dagtekening-aanslagbiljet plus één kalendermaand'
toelichting: 'Herleidbaar tot art. 9 lid 5 IW 1990, tweede volzin: *"De eerste termijn
  vervalt één maand na de dagtekening van het aanslagbiljet."*


  Grammaticale interpretatie: de vervaldatum van de eerste termijn is het resultaat
  van het optellen van één kalendermaand bij de dagtekening van het aanslagbiljet.
  De berekening is eenvoudig en enkelvoudig; er is geen tussenresultaat. Art. 9 lid
  10 IW 1990 sluit de Algemene termijnenwet uit, zodat de termijn kalenderstrikt loopt.'
