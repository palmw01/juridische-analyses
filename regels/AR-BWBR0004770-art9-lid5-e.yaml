formele-regel: '**lid 1 (bepalen invorderbaarheid belastingaanslag) is van toepassing**

  indien aan alle volgende voorwaarden is voldaan:

  - het aanslagtype voldoet aan de kwalificatievoorwaarden van lid 5 (voorlopige aanslag
  IB/VPB of voorlopige conserverende aanslag IB)

  - de dagtekening-in-vaststellingsjaar is vervuld

  - de resterende-maanden-jaar bedraagt ten hoogste 1'
toelichting: 'Herleidbaar tot art. 9 lid 5 IW 1990, derde volzin: *"Indien de toepassing
  van de eerste volzin niet leidt tot meer dan één termijn, vindt het eerste lid toepassing."*


  Systematische interpretatie: de terugvalregel is een beslissingsregel die bepaalt
  wanneer de specialisatieregel van lid 5 eerste volzin zijn werking verliest en de
  hoofdregel van lid 1 herneemt. De conditie ''niet leidt tot meer dan één termijn''
  is vervuld als `resterende-maanden-jaar` ≤ 1. Dit is het geval bij een dagtekening
  in november (1 resterende maand) of december (0 resterende maanden).


  De terugvalregel veronderstelt dat aan de kwalificatievoorwaarden van de eerste
  en tweede conditie van AR-9-5a al is voldaan (juist aanslagtype én dagtekening in
  belastingjaar); alleen dan is de vraag naar de drempelwaarde relevant.


  Uitvoer van deze regel is uitsluitend het activatie-signaal `terugvalregel-lid-1`
  (ja/nee). Het eindresultaat (invorderbaarheid-belastingaanslag) is de uitvoer van
  AR-BWBR0004770-art9-lid1-a, niet van deze regel. AR-5e stuurt de control-flow
  naar AR-1-a zodra `terugvalregel-lid-1` = ja.'
voorbeeldreeksen:
- invoerwaarden: 'aanslagtype: voorlopige IB; dagtekening: 15 november 2026; resterende-maanden-jaar:
    1'
  verwachte-uitkomst: 'lid 1 van toepassing: ja; invorderbaarheid zes weken na dagtekening'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'aanslagtype: voorlopige IB; dagtekening: 15 december 2026; resterende-maanden-jaar:
    0'
  verwachte-uitkomst: 'lid 1 van toepassing: ja; invorderbaarheid zes weken na dagtekening'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'aanslagtype: voorlopige IB; dagtekening: 15 oktober 2026; resterende-maanden-jaar:
    2'
  verwachte-uitkomst: 'lid 1 van toepassing: nee; lid 5 specialisatieregel geldt'
  juridisch-juist: true
  toelichting: null
- invoerwaarden: 'aanslagtype: voorlopige IB; dagtekening: 15 november 2026; resterende-maanden-jaar:
    1'
  verwachte-uitkomst: 'lid 5 van toepassing: 1 resterende maand = 1 termijn'
  juridisch-juist: false
  toelichting: 'Grensgeval: "niet leidt tot meer dan één termijn" — 1 resterende
    maand leidt tot 1 termijn (de eerste), dus de terugval naar lid 1 is van toepassing,
    niet lid 5.'
