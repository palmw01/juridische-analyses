formele-regel: '**termijnbedrag moet berekend worden als**

  het bedrag van de belastingaanslag gedeeld door resterende-maanden-jaar'
toelichting: "Herleidbaar tot art. 9 lid 5 IW 1990, eerste volzin: *\"in zoveel **gelijke**\
  \ termijnen als er na de maand...\"*\n\nSystematische interpretatie: De wettelijke\
  \ eis dat termijnen \"gelijke\" zijn, noodzaakt tot een rekenkundige operatie waarbij\
  \ het bedrag van de belastingaanslag evenredig wordt verdeeld over het aantal beschikbare\
  \ termijnen. Het aanslagbedrag is een impliciet attribuut van de belastingaanslag\
  \ als rechtsobject; een apart begrip hiervoor ontbreekt in de wetstekst van lid 5.\n\
  \n**A5-signaal (ontbrekend uitvoeringsbeleid):** De wettekst zwijgt\
  \ over de behandeling van afrondingsverschillen indien het bedrag van de aanslag niet exact\
  \ deelbaar is door het aantal termijnen. In de ICT-implementatie moet hier aanvullend\
  \ beleid voor worden vastgesteld (bijv. het restant verrekenen in de eerste of laatste\
  \ termijn) om te borgen dat het totaal van de termijnbedragen exact gelijk is aan\
  \ het bedrag van de belastingaanslag."
