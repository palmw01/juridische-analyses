formele-regel: '**Een belastingaanslag is invorderbaar**

  indien aan alle volgende voorwaarden is voldaan:

  - de belastingaanslag heeft een dagtekening van het aanslagbiljet

  - het tijdstip van beoordeling is gelegen op of na het tijdstip van de dagtekening
  van het aanslagbiljet plus zes weken'
toelichting: 'Herleidbaar tot art. 9 lid 1 IW 1990: *"Een belastingaanslag is invorderbaar
  zes weken na de dagtekening van het aanslagbiljet."*


  De grammaticale interpretatie levert een beslissingsregel op: invorderbaarheid treedt
  in (ja/nee) zodra de termijn van zes weken na de dagtekening is verstreken. De datum
  van dagtekening is het rechtsfeit dat de termijn doet aanvangen; de termijn van
  zes weken (parameter) is de vaste drempel.


  Precisering: art. 9 lid 10 IW 1990 sluit de Algemene termijnenwet uitdrukkelijk
  uit. Dit betekent dat de termijn van zes weken kalenderstrikt doorloopt, zonder
  verlenging bij weekenden of feestdagen.


  Lid 1 is de hoofdregel. De leden 2, 4, 5, 6, 7, 8 en 9 bevatten specialisatieregels
  die lid 1 opzijzetten voor specifieke aanslagsoorten. Deze specialisaties vallen
  buiten de scope van AR-9-1.'
