formele-regel: |
  In afwijking van berekenen vervaldatum één maand bij dagtekening 28 februari (standaard):
  vervaldag-schrikkeljaar-28-februari is 28 maart
  indien aan alle volgende voorwaarden is voldaan:
  - de dagtekening van het aanslagbiljet is gelijk aan 28 februari
  - het schrikkeljaar-voorbehoud is van toepassing (het jaar is een schrikkeljaar)
  - de betalingstermijn-een-maand-of-zes-weken is vervuld met één maand

  In afwijking van berekenen vervaldatum zes weken bij dagtekening 28 februari (standaard):
  vervaldag-schrikkeljaar-28-februari is 10 april
  indien aan alle volgende voorwaarden is voldaan:
  - de dagtekening van het aanslagbiljet is gelijk aan 28 februari
  - het schrikkeljaar-voorbehoud is van toepassing (het jaar is een schrikkeljaar)
  - de betalingstermijn-een-maand-of-zes-weken is vervuld met zes weken
toelichting: |
  Herleidbaar tot LI 2008 sectie 9.5, tweede rekenscenario (schrikkeljaarvariant).

  In een niet-schrikkeljaar is 28 februari de laatste dag van de maand. De beperkingsregel
  zou dan de standaardregel zijn: vervaldatum bij één maand = 31 maart (laatste dag van maart
  bestaat wel), bij zes weken = 11 april (28 + 42 = 11 april bij 28 febuari en een 28-dagige
  februari).

  In een schrikkeljaar heeft februari 29 dagen, dus is 28 februari niet de laatste dag. Dan
  geldt de zelfde-dagnummer-regel: één maand later op de 28e = 28 maart. Voor zes weken:
  28 februari + 42 dagen in een schrikkeljaar (29-dagige februari) = 10 april.

  De 'tenzij'-constructie markeert dit als Specialisatieregel: de uitkomst wijkt af van de
  standaardregel voor het 28-februari-scenario.

  Grammaticale interpretatie: de tekst stelt letterlijk 'in welk geval de termijn vervalt
  op 28 maart dan wel 10 april'.
