formele-regel: "**termijn-eindigt-voor-31-december is waar**\nindien aan alle volgende\
  \ voorwaarden is voldaan:\n- het aantal resterende-maanden-jaar bedraagt ten minste\
  \ 2 (lid 5 is van toepassing)\n- de vervaldag van de laatste betalingstermijn, berekend\
  \ conform AR-9-5c, valt vóór 31 december van het belastingjaar"
toelichting: "Herleidbaar tot LI 2008 §9.1 (uitvoeringsbeleid bij art. 9 lid 5 IW\
  \ 1990).\n\nDe Leidraad Invordering 2008 geeft uitvoering aan de wettelijke termijnenregeling\
  \ van art. 9 lid 5 door een aanvullende grensregel te stellen: indien de berekende\
  \ vervaldagen leiden tot een laatste termijn die eindigt vóór 31 december, wordt\
  \ de vervaldatum van die termijn verschoven naar 31 december. Dit voorkomt dat de\
  \ belastingschuldige bij een late dagtekening in het belastingjaar effectief minder\
  \ betalingstijd krijgt dan de wettelijke regeling beoogt.\n\nDit begrip is een tussenresultaat:\
  \ het wordt uitsluitend berekend als invoer voor de beperkingsregel AR-9-5e (vervaldag-31-december).\
  \ De regel is gebaseerd op uitvoeringsbeleid, niet op een expliciete wetsbepaling;\
  \ volledige juridische onderbouwing vereist annotatie van LI 2008 §9 in zijn geheel.\n\
  \n**A5-signaal:** de wettekst van art. 9 lid 5 IW 1990 zwijgt over de 31 december-cap;\
  \ deze volgt uitsluitend uit de Leidraad. Bij conflict tussen wet en Leidraad prevaleert\
  \ de wet."
voorbeeldreeksen:
- invoerwaarden: 'dagtekening: 1 april 2026; resterende maanden: 8; laatste vervaldag
